<title>전기 퀴즈 대작전 - 조민규영어</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* VOICE: 90년대 오락실 퀴즈 기계 — 빠르고, 시끄럽고, 반짝인다
IDEA: 동전 넣고 하는 아케이드 퀴즈 캐비닛
PICTURE: 게임 화면 자체(타이머 바·하트·콤보·문제판), 타이틀엔 도는 원자
COLOUR and TYPE: 밤보라 바탕, 노랑 강조, 빨강(+)·파랑(-) 전하색 / Black Han Sans + Press Start 2P 숫자
LAYOUT: 휴대폰 우선 세로 캐비닛 한 열 */
:root{color-scheme:dark;--bg:#120a2a;--ink:#f4f0ff;--dim:#b3a9da;--y:#ffd400;--p:#ff4064;--m:#3bb8ff;--g:#3ee68f;--line:#3d2a85}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 70% at 50% 0,#2b1863,var(--bg) 65%);color:var(--ink);font:16px/1.5 "Noto Sans KR",sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--y);outline-offset:2px}
.cab{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:10px 10px 18px}
.marquee{text-align:center;font-family:"Black Han Sans",sans-serif;font-size:clamp(26px,7.5vw,40px);line-height:1.1;color:var(--y);text-shadow:0 3px 0 #c2520c,0 0 22px #ffb30055;padding:8px 0 10px}
.screen{position:relative;flex:1;min-height:560px;background:#0b0620;border:4px solid var(--line);border-radius:18px;box-shadow:inset 0 0 50px #000,0 0 0 4px #07031a,0 12px 30px #0009;padding:14px;overflow:hidden;display:flex;flex-direction:column}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,#0000 0 2px,#00000030 2px 3px);z-index:9}
.px{font-family:"Press Start 2P",monospace}
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px}
.hud .score{color:var(--y);font-size:14px}
.hearts{color:var(--p);font-size:20px;letter-spacing:2px;line-height:1}
.hearts .off{color:#3a2c63}
.mute{width:44px;height:36px;border:2px solid var(--line);border-radius:8px;font-size:10px;color:var(--dim)}
.sub{display:flex;justify-content:space-between;margin-top:10px;font-size:10px;color:var(--dim)}
.combo{color:var(--g)}
.timer{height:14px;border-radius:7px;background:#241650;margin:10px 0 14px;overflow:hidden;border:2px solid #2f1f6b}
.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--g),var(--y));transform-origin:left}
.timer.hot i{background:linear-gradient(90deg,var(--p),#ff8a3d)}
.q{font-weight:900;font-size:clamp(19px,5.2vw,24px);line-height:1.4;text-wrap:balance;min-height:3em;margin:4px 0 14px}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{min-height:56px;text-align:left;padding:12px 14px;border-radius:12px;background:#1e1347;border:3px solid #3a2a7d;font-weight:700;font-size:17px;line-height:1.35;display:flex;gap:10px;align-items:center;transition:transform .08s}
.opt:active{transform:scale(.97)}
.opt b{font-family:"Press Start 2P";font-size:11px;color:var(--y);flex:none}
.opt.big{justify-content:center;font-family:"Black Han Sans";font-size:40px;min-height:96px}
.opt.boss{justify-content:center;font-size:22px;min-height:88px;text-align:center}
.opt.ok{background:#0f4d33;border-color:var(--g);animation:pop .3s}
.opt.no{background:#5a1027;border-color:var(--p)}
.opt[disabled]{cursor:default}
.plus{color:var(--p);font-weight:900}.minus{color:var(--m);font-weight:900}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.slot{height:48px;border:2px dashed #4a3a92;border-radius:10px;display:grid;place-items:center;font-weight:900;color:var(--dim);font-size:15px}
.slot.f{border-style:solid;border-color:var(--g);color:var(--ink);background:#0f3b2a}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{min-height:52px;border-radius:12px;background:#1e1347;border:3px solid #3a2a7d;font-weight:900;font-size:17px}
.chip.used{opacity:.2;pointer-events:none}
.ex{margin-top:14px;padding:12px 14px;border-radius:12px;background:#17103a;border-left:5px solid var(--y);font-size:15.5px;line-height:1.55;display:none}
.ex.show{display:block;animation:up .25s}
.ex strong{color:var(--y)}
.next{margin-top:12px;width:100%;min-height:54px;border-radius:12px;background:var(--y);color:#1a0e3a;font-family:"Black Han Sans";font-size:22px;display:none;box-shadow:0 4px 0 #b06d00}
.next.show{display:block}
.next:active{transform:translateY(3px);box-shadow:0 1px 0 #b06d00}
.view{display:none;flex:1;flex-direction:column}
.view.on{display:flex}
#title{align-items:center;justify-content:center;text-align:center;gap:6px}
.atom{width:min(62vw,240px);aspect-ratio:1}
.atom .orb{transform-origin:100px 100px;animation:spin 3.2s linear infinite}
.atom .orb.b{animation-duration:4.6s;animation-direction:reverse}
.t1{font-family:"Black Han Sans";font-size:clamp(30px,9vw,44px);line-height:1.05;color:#fff;text-shadow:0 0 18px #7b5cff}
.t2{color:var(--dim);font-size:15px;margin:2px 0 10px}
.start{min-height:60px;padding:0 34px;border-radius:14px;background:var(--p);font-family:"Black Han Sans";font-size:26px;box-shadow:0 5px 0 #8c1430;animation:blink 1.1s steps(2) infinite}
.coin{font-size:10px;color:var(--y);margin-top:14px;animation:blink 1.4s steps(2) infinite}
.rules{font-size:13.5px;color:var(--dim);margin-top:16px;line-height:1.7}
.hi{font-size:10px;color:var(--g);margin-top:10px}
#banner{position:absolute;inset:0;display:none;place-items:center;text-align:center;z-index:8;background:#0b0620e6}
#banner.on{display:grid}
#banner .bt{font-family:"Black Han Sans";font-size:clamp(34px,10vw,52px);line-height:1.1;color:var(--y);text-shadow:0 4px 0 #c2520c;animation:zoom .5s}
#banner .bs{font-family:"Press Start 2P";font-size:12px;color:var(--ink);margin-bottom:12px}
#banner .bn{font-size:15px;color:var(--dim);margin-top:12px}
.float{position:absolute;right:16px;top:64px;font-family:"Press Start 2P";font-size:14px;color:var(--g);z-index:7;animation:fl .9s forwards;pointer-events:none}
.fever .screen{border-color:var(--p);animation:glow .6s infinite alternate}
.shake{animation:shake .35s}
#cont{align-items:center;justify-content:center;text-align:center}
.cnum{font-family:"Press Start 2P";font-size:72px;color:var(--p);margin:14px 0}
.ghost{margin-top:10px;min-height:46px;padding:0 20px;border-radius:12px;border:2px solid var(--line);color:var(--dim)}
#over h2{font-family:"Black Han Sans";font-size:clamp(32px,9vw,46px);margin:6px 0 0;text-align:center;line-height:1.1}
.grade{font-family:"Press Start 2P";font-size:64px;text-align:center;margin:14px 0 6px;color:var(--y);text-shadow:0 0 20px #ffd40088}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.stats div{background:#1a1040;border-radius:10px;padding:10px 6px;text-align:center;font-size:12px;color:var(--dim)}
.stats b{display:block;font-family:"Press Start 2P";font-size:13px;color:var(--ink);margin-top:6px;white-space:nowrap}
.note{margin-top:8px}
.note h3{font-size:17px;margin:12px 0 8px;color:var(--y)}
.note li{background:#17103a;border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:14.5px;line-height:1.55;list-style:none}
.note ul{padding:0;margin:0}
.note .ans{color:var(--g);font-weight:900}
.btns{display:grid;gap:10px;margin-top:14px}
.btns .next{display:block}
@keyframes spin{to{transform:rotate(360deg)}}

 {q:'멀티탭 한 곳에 많은 기구를 동시에 연결하면 안 되는 까닭은?',o:['각 기구의 전류가 모여 멀티탭 전선에 센 전류가 흘러 화재 위험','전압이 0이 되어서','저항이 너무 커져서','전류의 방향이 바뀌어서'],a:0,ex:'병렬 → 기구가 많을수록 전체 저항↓ 전체 전류↑ → <strong>과도한 전류 → 화재 위험</strong>'},
 {q:'전하가 없어지거나 새로 만들어지지 않고 양이 보존되는 법칙은?',o:['전하량 보존 법칙','옴의 법칙','에너지 보존 법칙','대전열'],a:0,ex:'<strong>전하량 보존 법칙</strong> → 직렬: <i>I</i><sub>A</sub>=<i>I</i><sub>B</sub>=<i>I</i><sub>C</sub>, 병렬: <i>I</i><sub>A</sub>=<i>I</i><sub>B</sub>+<i>I</i><sub>C</sub>'},
 {q:'전구 B, C를 <b>병렬</b>연결했을 때 전체 전류 <i>I</i><sub>A</sub>는?',o:['<i>I</i><sub>B</sub> + <i>I</i><sub>C</sub>','<i>I</i><sub>B</sub> = <i>I</i><sub>C</sub>','<i>I</i><sub>B</sub> − <i>I</i><sub>C</sub>','<i>I</i><sub>B</sub> × <i>I</i><sub>C</sub>'],a:0,ex:'병렬: 나뉘었다 다시 합쳐짐 → <strong><i>I</i><sub>A</sub> = <i>I</i><sub>B</sub> + <i>I</i><sub>C</sub></strong>'},
 {q:'전구 B, C를 <b>직렬</b>연결했을 때 전류의 관계는?',o:['<i>I</i><sub>A</sub> = <i>I</i><sub>B</sub> = <i>I</i><sub>C</sub>','<i>I</i><sub>A</sub> = <i>I</i><sub>B</sub> + <i>I</i><sub>C</sub>','<i>I</i><sub>B</sub> > <i>I</i><sub>C</sub>','<i>I</i><sub>C</sub> = 0'],a:0,ex:'직렬: 길이 하나 → <strong>어디서나 전류가 같다</strong>'}];

const bossQ=()=>{let i=Math.random()*6|0,j;do j=Math.random()*6|0;while(j===i);const L=Math.min(i,j),R=Math.max(i,j),plus=Math.random()<.5,A=LAD[i],B=LAD[j];
 return {boss:1,q:`${A} ✕ ${B} 마찰!<br>${plus?'(+)':'(-)'}로 대전되는 쪽은?`,o:[A,B],ans:plus?LAD[L]:LAD[R],ex:`${LAD[L]}이(가) 대전열에서 더 왼쪽 → ${LAD[L]} (+), ${LAD[R]} (-)`}};
const QTY=[['전류','<i>I</i>','A(암페어)'],['전압','<i>V</i>','V(볼트)'],['저항','<i>R</i>','Ω(옴)']];
const DEV=[['battery','전지'],['switch','스위치'],['bulb','전구'],['resistor','저항'],['amm','전류계'],['volt','전압계']];
const symQ=()=>{const t=Math.random()*5|0,k=pick(QTY),ex=`${k[0]}: 기호 <strong>${k[1]}</strong>, 단위 <strong>${k[2]}</strong>`;
 if(t===0)return {boss:1,q:`${k[0]}의 <b>기호</b>는?`,o:['<i>I</i>','<i>V</i>','<i>R</i>','A'],ans:k[1],ex};
 if(t===1)return {boss:1,q:`${k[0]}의 <b>단위</b>는?`,o:['A(암페어)','V(볼트)','Ω(옴)','C(쿨롬)'],ans:k[2],ex};
 if(t===2){const u=Math.random()<.5;return {boss:1,q:u?`단위 <b>${k[2]}</b>은(는) 무엇의 단위?`:`기호 <b>${k[1]}</b>가 나타내는 것은?`,o:['전류','전압','저항','전하량'],ans:k[0],ex}}
 const d=pick(DEV),others=shuf(DEV.filter(x=>x!==d)).slice(0,3);
 if(t===3)return {boss:1,q:'이 기호는?'+SYM[d[0]],o:[d,...others].map(x=>x[1]),ans:d[1],ex:`이 기호는 <strong>${d[1]}</strong>`};
 return {boss:1,q:`<b>${d[1]}</b>의 기호는?`,o:[d,...others].map(x=>'#'+x[0]),ans:'#'+d[0],ex:`<strong>${d[1]}</strong>의 기호를 기억!`}};
const mkOpts=(ans,c,u)=>{const s=[...new Set(c.filter(x=>x>0&&x!==ans&&Number.isInteger(x)))];let n=ans+1;while(s.length<3){if(n!==ans&&!s.includes(n))s.push(n);n++}return [ans,...s.slice(0,3)].map(x=>x+' '+u)};
const PAR=[[3,6,2],[2,2,1],[4,4,2],[6,6,3],[12,4,3],[10,10,5],[6,12,4],[20,5,4]];
const ohmQ=()=>{const t=Math.random()*5|0,R=pick([2,3,4,5,6,10]),I=pick([1,2,3,4]),V=R*I;let q,ans,o,ex;
 if(t===0){q=`저항 ${R} Ω에 ${I} A의 전류가 흐른다. 걸린 <b>전압</b>은?`;ans=V;o=mkOpts(V,[R+I,V*2,Math.abs(R-I),V+2],'V');ex=`<i>V</i> = <i>IR</i> = ${I} × ${R} = <strong>${V} V</strong>`}
 else if(t===1){q=`저항 ${R} Ω에 ${V} V의 전압을 걸었다. <b>전류</b>는?`;ans=I;o=mkOpts(I,[V*R,V+R,I*2,I+1],'A');ex=`<i>I</i> = <i>V</i>/<i>R</i> = ${V} ÷ ${R} = <strong>${I} A</strong>`}
 else if(t===2){q=`전압 ${V} V일 때 전류가 ${I} A 흘렀다. <b>저항</b>은?`;ans=R;o=mkOpts(R,[V*I,V+I,R*2,R+1],'Ω');ex=`<i>R</i> = <i>V</i>/<i>I</i> = ${V} ÷ ${I} = <strong>${R} Ω</strong>`}
 else if(t===3){const a=pick([1,2,3,4,5,6]),b=pick([2,4,5,8,10]);q=`${a} Ω과 ${b} Ω을 <b>직렬</b>연결. 전체 저항은?`;ans=a+b;o=mkOpts(a+b,[a*b,Math.abs(a-b),a+b+2,(a+b)*2],'Ω');ex=`직렬: <i>R</i> = ${a} + ${b} = <strong>${a+b} Ω</strong>`}
 else{const p=pick(PAR);q=`${p[0]} Ω과 ${p[1]} Ω을 <b>병렬</b>연결. 전체 저항은?`;ans=p[2];o=mkOpts(p[2],[p[0]+p[1],Math.abs(p[0]-p[1]),p[2]*2,p[2]+1],'Ω');ex=`병렬: <i>R</i> = (${p[0]}×${p[1]})/(${p[0]}+${p[1]}) = <strong>${p[2]} Ω</strong> — 병렬은 가장 작은 저항보다도 작아진다!`}
 return {q,o,ans:o[0],ex}};

const STAGES=[
 {no:'1',ch:1,n:'원자의 구조',qs:S1,t:12},
 {no:'2',ch:1,n:'마찰 전기',qs:S2,t:12},
 {no:'3',ch:1,n:'대전열',qs:S3,t:12,first:1},
 {no:'B1',ch:1,n:'BOSS · 대전열 배틀',gen:bossQ,cnt:8,t:6,boss:1,warn:'제한시간 6초 · 쉬지 말고 연속으로!'},
 {no:'4',ch:2,n:'전류',qs:S4,t:12},
 {no:'5',ch:2,n:'전압과 전기 기구 기호',qs:S5,t:12},
 {no:'SP',ch:2,n:'BONUS · 기호·단위 스피드',gen:symQ,cnt:10,t:5,boss:1,warn:'기호와 단위를 구분하라! 5초 컷'},
 {no:'6',ch:2,n:'저항과 옴의 법칙',qs:S6,t:14},
 {no:'7',ch:2,n:'저항의 연결',qs:S7,t:14},
 {no:'8',ch:2,n:'생활 속 직렬·병렬',qs:S8,t:10},
 {no:'B2',ch:2,n:'BOSS · 옴의 법칙 계산',gen:ohmQ,cnt:8,t:14,boss:1,warn:'V = IR 계산 8연발!'}];
const CH={1:'1. 전기의 발생',2:'2. 전기 회로와 에너지'};
const $=id=>document.getElementById(id);
let G,timerRaf,deadline,dur,locked,ordPos,muted=false,ac,contInt,lastTick=0;
let best={};try{best=JSON.parse(localStorage.getItem('eqBest')||'{}')}catch(e){}
function snd(f,d,type='square',v=.06,w=0,f2){if(muted)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime+w,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d)}catch(e){}}
const sOk=()=>{snd(880,.09);snd(1320,.14,'square',.06,.08)},sNo=()=>snd(220,.4,'sawtooth',.07,0,70),sTick=()=>snd(1500,.04,'square',.03),
 sFan=()=>[523,659,784,1047].forEach((f,i)=>snd(f,.12,'square',.05,i*.1)),sCombo=()=>[784,988,1175,1568].forEach((f,i)=>snd(f,.08,'triangle',.07,i*.05));
const show=v=>{for(const s of document.querySelectorAll('.view,.sel'))s.classList.toggle('on',s.id===v)};
const lbl=st=>/^\d/.test(st.no)?'STAGE '+st.no:st.no==='SP'?'BONUS':st.no==='R'?'REVIEW':'BOSS';
function selectView(){const b=k=>best[k]?String(best[k]).padStart(6,'0'):'';
 $('select').innerHTML=[1,2].map(c=>`<h3>${CH[c]}</h3><button class="allbtn" data-all="${c}">${c}단원 전체 연속 도전</button>`+STAGES.map((s,i)=>s.ch!==c?'':`<button class="stg${s.boss?' bs':''}" data-i="${i}"><span class="no">${s.no}</span><span class="nm">${s.n}</span><span class="best">${b('s'+s.no)}</span></button>`).join('')).join('')+`<button class="allbtn" data-all="0" style="margin-top:12px">전 범위 연속 도전 · ${b('all0')?'HI '+b('all0'):'11 STAGES'}</button>`;
 $('select').querySelectorAll('[data-i]').forEach(x=>x.onclick=()=>newGame([STAGES[+x.dataset.i]],'s'+STAGES[+x.dataset.i].no,+x.dataset.i));
 $('select').querySelectorAll('[data-all]').forEach(x=>x.onclick=()=>{const c=+x.dataset.all;newGame(STAGES.filter(s=>!c||s.ch===c),'all'+c)});
 show('select')}
function newGame(stages,key,idx){G={st:0,qi:0,list:[],score:0,lives:3,combo:0,max:0,right:0,total:0,wrong:[],cred:0,stages,key,idx};show('game');startStage()}
function startStage(){const st=G.stages[G.st];G.qi=0;
 G.list=st.gen?Array.from({length:st.cnt},st.gen):st.first?[st.qs[0],...shuf(st.qs.slice(1))]:shuf(st.qs);
 hud();sFan();banner(st.boss?(st.no==='SP'?'BONUS STAGE':'WARNING!!'):lbl(st),st.n,st.warn||`${G.list.length}문제`,1500,ask)}
function banner(s,t,n,ms,cb){$('bS').textContent=s;$('bT').innerHTML=t;$('bN').innerHTML=n||'';$('banner').classList.add('on');setTimeout(()=>{$('banner').classList.remove('on');cb&&cb()},ms)}
const mult=()=>G.combo>=8?4:G.combo>=5?3:G.combo>=3?2:1;
function hud(){$('score').textContent=String(G.score).padStart(6,'0');
 $('hearts').innerHTML=[0,1,2].map(i=>`<span class="${i<G.lives?'':'off'}">♥</span>`).join('');
 $('stageLbl').textContent=lbl(G.stages[G.st]);$('qLbl').textContent=(G.qi+1)+'/'+G.list.length;
 const m=mult();$('comboLbl').textContent=G.combo>=2?G.combo+' COMBO'+(m>1?' x'+m:''):'';
 $('cab').classList.toggle('fever',G.combo>=8)}
const plain=s=>s.replace(/<[^>]+>/g,'');
function ask(){const q=G.list[G.qi];locked=false;hud();
 $('ex').className='ex';$('next').className='next';$('q').innerHTML=fmt(q.q);const A=$('area');
 if(q.ord){ordPos=0;const it=q.items;A.innerHTML=`<div class="slots">${it.map((_,i)=>`<div class="slot" id="sl${i}">${i+1}</div>`).join('')}</div><div class="chips">${shuf(it).map(x=>`<button class="chip" data-v="${x}">${x}</button>`).join('')}</div>`;
  A.querySelectorAll('.chip').forEach(b=>b.onclick=()=>chip(b));}
 else if(q.ox){A.innerHTML=`<div class="opts two"><button class="opt big" data-v="1" style="color:var(--g)">O</button><button class="opt big" data-v="0" style="color:var(--p)">X</button></div>`;
  A.querySelectorAll('.opt').forEach(b=>b.onclick=()=>judge((b.dataset.v==='1')===q.a,b));}
 else{const ans=q.ans||q.o[q.a],os=shuf(q.o),sym=os[0].startsWith('#'),two=sym||os.every(x=>plain(x).length<=8);
  A.innerHTML=`<div class="opts${two?' two':''}">${os.map((x,i)=>`<button class="opt${sym?' symo':q.boss&&os.length===2?' boss':''}" data-v="${x}">${sym||two?'':`<b>${'ABCD'[i]}</b>`}<span>${rend(x)}</span></button>`).join('')}</div>`;
  A.querySelectorAll('.opt').forEach(b=>b.onclick=()=>judge(b.dataset.v===ans,b));}
 const st=G.stages[G.st];dur=(q.ord?22:st.t)*1000;deadline=performance.now()+dur;lastTick=0;cancelAnimationFrame(timerRaf);tick()}
function tick(){const left=deadline-performance.now(),f=Math.max(0,left/dur);$('bar').style.transform=`scaleX(${f})`;$('timer').classList.toggle('hot',f<.3);
 const s=Math.ceil(left/1000);if(left<3000&&s!==lastTick&&left>0){lastTick=s;sTick()}
 if(left<=0){judge(false,null,true);return}timerRaf=requestAnimationFrame(tick)}
function chip(b){if(locked)return;const it=G.list[G.qi].items;if(b.dataset.v===it[ordPos]){b.classList.add('used');const s=$('sl'+ordPos);s.textContent=b.dataset.v;s.classList.add('f');ordPos++;snd(600+ordPos*120,.07);if(ordPos===it.length)judge(true)}
 else{b.style.borderColor='var(--p)';judge(false)}}
function judge(ok,btn,timeout){if(locked)return;locked=true;cancelAnimationFrame(timerRaf);
 const q=G.list[G.qi],frac=Math.max(0,(deadline-performance.now())/dur);G.total++;
 $('area').querySelectorAll('button').forEach(b=>b.disabled=true);
 if(!q.ox&&!q.ord){const ans=q.ans||q.o[q.a];$('area').querySelectorAll('.opt').forEach(b=>{if(b.dataset.v===ans)b.classList.add('ok')})}
 if(q.ox)$('area').querySelectorAll('.opt').forEach(b=>{if((b.dataset.v==='1')===q.a)b.classList.add('ok')});
 if(ok){G.combo++;G.max=Math.max(G.max,G.combo);G.right++;const gain=Math.round((100+frac*150)*mult());G.score+=gain;
  float('+'+gain);
  if([3,5,8].includes(G.combo)){sCombo();float(G.combo===8?'FEVER!!':G.combo+' COMBO!',1)}else sOk();
  $('ex').innerHTML='<strong>'+(frac>.6?'번개 같은 정답!':'정답!')+'</strong> '+fmt(q.ex);$('ex').className='ex show';hud();
  setTimeout(advance,q.boss?900:1500)}
 else{if(btn)btn.classList.add('no');G.combo=0;G.lives--;if(!G.wrong.includes(q))G.wrong.push(q);
  sNo();$('screen').classList.remove('shake');void $('screen').offsetWidth;$('screen').classList.add('shake');
  $('ex').innerHTML='<strong>'+(timeout?'TIME OVER!':'땡!')+'</strong> '+fmt(q.ex);$('ex').className='ex show';hud();
  $('next').textContent=G.lives<=0?'GAME OVER ▶':'NEXT ▶';$('next').className='next show';$('next').focus()}}
function float(t,big){const fl=document.createElement('div');fl.className='float';if(big)fl.style.cssText='left:0;right:0;top:40%;text-align:center;font-size:26px;color:var(--y)';fl.textContent=t;$('screen').appendChild(fl);setTimeout(()=>fl.remove(),900)}
$('next').onclick=()=>{if(G.lives<=0)return contScreen();advance()};
function advance(){G.qi++;if(G.qi<G.list.length)return ask();G.st++;if(G.st<G.stages.length)return startStage();finish(true)}
function contScreen(){show('cont');let n=9;$('cnum').textContent=n;$('credLbl').textContent='CREDIT USED '+G.cred;clearInterval(contInt);
 contInt=setInterval(()=>{n--;$('cnum').textContent=n;snd(400,.08);if(n<=0){clearInterval(contInt);finish(false)}},1000)}
$('contBtn').onclick=()=>{clearInterval(contInt);G.cred++;G.lives=3;G.combo=0;show('game');sFan();advance()};
$('giveUp').onclick=()=>{clearInterval(contInt);finish(false)};
function finish(clear){$('cab').classList.remove('fever');show('over');
 const rate=G.total?Math.round(G.right/G.total*100):0,rev=G.key==='rev';
 const gr=!clear?'C':G.cred===0&&rate>=95?'S':G.cred===0&&rate>=85?'A':rate>=70?'B':'C';
 $('overT').textContent=clear?(rev?'REVIEW CLEAR!':G.stages.length>1?'ALL CLEAR!':'STAGE CLEAR!'):'GAME OVER';$('overT').style.color=clear?'var(--y)':'var(--p)';
 $('grade').textContent=gr;
 $('stats').innerHTML=`<div>점수<b>${G.score}</b></div><div>정답률<b>${rate}%</b></div><div>최대 콤보<b>${G.max}</b></div>`;
 let nh='';if(!rev&&G.score>(best[G.key]||0)){best[G.key]=G.score;try{localStorage.setItem('eqBest',JSON.stringify(best))}catch(e){}nh='NEW RECORD! '}
 $('hiOver').textContent=rev?'':nh+'HI-SCORE '+String(best[G.key]||0).padStart(6,'0');
 const w=G.wrong;
 $('note').innerHTML=w.length?`<h3>오답 노트 (${w.length})</h3><ul>${w.map(q=>`<li>${fmt(q.q)}<br><span class="ans">→ ${q.ord?q.items.join(' › '):q.ox?(q.a?'O':'X'):rend(q.ans||q.o[q.a])}</span><br>${fmt(q.ex)}</li>`).join('')}</ul>`:'<h3>오답 없음 — 완벽합니다!</h3>';
 $('retryWrong').style.display=w.length?'block':'none';
 const ni=G.idx!=null&&G.idx+1<STAGES.length&&clear;$('nextStage').style.display=ni?'block':'none';
 $('again').className=ni?'ghost':'next';$('again').style.display='block';
 clear?[523,659,784,1047,1319].forEach((f,i)=>snd(f,.15,'square',.05,i*.12)):[392,330,262,196].forEach((f,i)=>snd(f,.22,'triangle',.07,i*.18))}
$('startBtn').onclick=selectView;
$('toSelect').onclick=selectView;
$('again').onclick=()=>newGame(G.stages,G.key,G.idx);
$('nextStage').onclick=()=>{const i=G.idx+1;newGame([STAGES[i]],'s'+STAGES[i].no,i)};
$('retryWrong').onclick=()=>newGame([{no:'R',n:'틀린 문제 복습',qs:G.wrong.slice(),t:14}],'rev');
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'OFF':'SND'};
}
</script>
