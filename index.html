<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>숙명 곰돌이 주기율표 게임</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Apple SD Gothic Neo','Malgun Gothic','Segoe UI',sans-serif;background:linear-gradient(135deg,#f3f0fa,#fce4f0);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px;}
h1{font-size:22px;font-weight:700;color:#4A3F6B;margin-bottom:2px;text-align:center;}
.subtitle{font-size:13px;color:#999;margin-bottom:14px;text-align:center;}
.score-bar{display:flex;gap:10px;margin-bottom:14px;align-items:center;flex-wrap:wrap;justify-content:center;}
.pill{background:#fff;border:1px solid #ddd;border-radius:20px;padding:5px 16px;font-size:14px;color:#555;}
.pill span{font-weight:700;color:#4A3F6B;}
.music-btn{background:#fff;border:1.5px solid #ccc;border-radius:20px;padding:5px 14px;font-size:13px;cursor:pointer;color:#4A3F6B;font-weight:600;}
.music-btn.on{background:#4A3F6B;color:#fff;border-color:#4A3F6B;}
.mode-tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;justify-content:center;}
.tab{padding:7px 16px;border-radius:20px;border:1.5px solid #ccc;font-size:13px;cursor:pointer;background:#fff;color:#666;transition:all 0.15s;}
.tab.active{background:#4A3F6B;color:#fff;border-color:#4A3F6B;}
.card{background:#fff;border-radius:24px;padding:24px;width:100%;max-width:480px;box-shadow:0 6px 30px rgba(74,63,107,0.13);}
.bear-wrap{display:flex;flex-direction:column;align-items:center;margin-bottom:10px;overflow:hidden;}
.grow-msg{font-size:12px;color:#7F77DD;margin-top:5px;font-weight:600;text-align:center;}
.progress-bar{height:6px;background:#eee;border-radius:3px;margin-bottom:14px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,#b39ddb,#4A3F6B);border-radius:3px;transition:width 0.3s;}
.q-label{font-size:12px;color:#bbb;margin-bottom:6px;text-align:center;}
.q-main{font-size:18px;font-weight:700;color:#333;margin-bottom:16px;text-align:center;line-height:1.5;}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.opt{padding:13px;border:1.5px solid #ddd;border-radius:14px;background:#fafafa;color:#333;font-size:15px;cursor:pointer;transition:all 0.15s;font-family:inherit;width:100%;}
.opt:hover:not(:disabled){background:#f3f0fa;border-color:#7F77DD;}
.opt.correct{background:#eaf3de;border-color:#3B6D11;color:#27500A;font-weight:700;}
.opt.wrong{background:#fcebeb;border-color:#A32D2D;color:#A32D2D;}
.opt:disabled{cursor:default;}
.feedback{text-align:center;padding:10px;border-radius:12px;font-size:14px;font-weight:600;margin-top:10px;}
.fb-ok{background:#eaf3de;color:#27500A;}
.fb-no{background:#fcebeb;color:#A32D2D;}
.next-btn{width:100%;margin-top:12px;padding:13px;border-radius:14px;background:#4A3F6B;color:#fff;border:none;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.next-btn:hover{background:#3C3489;}
.fill-input{width:100%;padding:13px;border:1.5px solid #ddd;border-radius:14px;font-size:16px;text-align:center;font-family:inherit;margin-bottom:10px;outline:none;}
.fill-input:focus{border-color:#7F77DD;}
.submit-btn{width:100%;padding:12px;border-radius:14px;background:#f3f0fa;border:1.5px solid #ccc;font-size:15px;cursor:pointer;font-family:inherit;color:#4A3F6B;font-weight:600;}
.tbl-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
.tbl-cell{background:#EEEDFE;border:1px solid #AFA9EC;border-radius:10px;padding:6px 4px;text-align:center;}
.tn{font-size:10px;color:#534AB7;}
.ts{font-size:15px;font-weight:700;color:#26215C;}
.tk{font-size:10px;color:#3C3489;}
.result-wrap{text-align:center;}
.result-score{font-size:52px;font-weight:700;color:#4A3F6B;margin:6px 0;}
.review-section{margin-top:20px;text-align:left;}
.review-title{font-size:15px;font-weight:700;color:#A32D2D;margin-bottom:10px;text-align:center;}
.review-item{background:#fff7f7;border:1.5px solid #f4b8b8;border-radius:12px;padding:12px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px;}
.ri-num{width:32px;height:32px;background:#fcebeb;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#A32D2D;flex-shrink:0;}
.ri-info{flex:1;}
.ri-sym{font-size:18px;font-weight:700;color:#4A3F6B;}
.ri-name{font-size:13px;color:#666;margin-top:2px;}
.btn-row{display:flex;gap:10px;margin-top:14px;}
.btn-half{flex:1;padding:13px;border-radius:14px;border:none;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn-retry-wrong{background:#fcebeb;color:#A32D2D;}
.btn-restart{background:#4A3F6B;color:#fff;}
.review-mode-banner{background:#fff3cd;border:1.5px solid #ffc107;border-radius:12px;padding:8px 14px;font-size:13px;color:#856404;font-weight:600;text-align:center;margin-bottom:12px;}
.dl-btn{margin-top:18px;padding:10px 24px;background:#fff;border:1.5px solid #4A3F6B;border-radius:20px;color:#4A3F6B;font-size:13px;font-weight:700;cursor:pointer;display:block;text-align:center;text-decoration:none;}
.dl-btn:hover{background:#4A3F6B;color:#fff;}
</style>
</head>
<body>

<h1>🐻 숙명 곰돌이 주기율표</h1>
<p class="subtitle">문제를 맞힐수록 곰돌이가 무한으로 커져요!</p>

<div class="score-bar">
  <div class="pill">점수 <span id="scoreDisp">0</span></div>
  <div class="pill">연속 <span id="streakDisp">0</span></div>
  <button class="music-btn" id="musicBtn" onclick="toggleMusic()">♪ 음악 켜기</button>
</div>

<div class="mode-tabs">
  <div class="tab active" onclick="setMode('mc_name')">번호→이름</div>
  <div class="tab" onclick="setMode('mc_sym')">번호→기호</div>
  <div class="tab" onclick="setMode('fill')">직접입력</div>
  <div class="tab" onclick="setMode('table')">전체보기</div>
</div>

<div class="card" id="gameArea"></div>



<script>
const els=[
  {n:1,sym:'H',name:'수소'},{n:2,sym:'He',name:'헬륨'},{n:3,sym:'Li',name:'리튬'},
  {n:4,sym:'Be',name:'베릴륨'},{n:5,sym:'B',name:'붕소'},{n:6,sym:'C',name:'탄소'},
  {n:7,sym:'N',name:'질소'},{n:8,sym:'O',name:'산소'},{n:9,sym:'F',name:'플루오린'},
  {n:10,sym:'Ne',name:'네온'},{n:11,sym:'Na',name:'나트륨'},{n:12,sym:'Mg',name:'마그네슘'},
  {n:13,sym:'Al',name:'알루미늄'},{n:14,sym:'Si',name:'규소'},{n:15,sym:'P',name:'인'},
  {n:16,sym:'S',name:'황'},{n:17,sym:'Cl',name:'염소'},{n:18,sym:'Ar',name:'아르곤'},
  {n:19,sym:'K',name:'칼륨'},{n:20,sym:'Ca',name:'칼슘'},
];

let mode='mc_name',score=0,streak=0,qIdx=0,queue=[],answered=false,fillTarget=null;
let wrongList=[],isReviewMode=false;
let musicOn=false,audioCtx=null,musicInterval=null;

/* ---- MUSIC (Web Audio Only - 외부 의존성 없음) ---- */
function toggleMusic(){
  musicOn=!musicOn;
  const btn=document.getElementById('musicBtn');
  if(musicOn){btn.textContent='♪ 음악 끄기';btn.classList.add('on');startMusic();}
  else{btn.textContent='♪ 음악 켜기';btn.classList.remove('on');stopMusic();}
}

function startMusic(){
  try{
    stopMusic();
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    scheduleMelody();
  }catch(e){console.log('Audio not supported');}
}

function stopMusic(){
  clearTimeout(musicInterval);
  if(audioCtx){try{audioCtx.close();}catch(e){}}
  audioCtx=null;
}

function scheduleMelody(){
  if(!musicOn||!audioCtx)return;
  // 밝고 신나는 멜로디 (도레미솔라 반복)
  const bpm=160, beat=60/bpm;
  const notes=[
    [523,1],[587,1],[659,1],[784,1],[880,2],
    [784,1],[659,1],[523,2],[659,1],[784,1],
    [880,1],[1047,2],[880,1],[784,1],[659,1],[523,4]
  ];
  let t=audioCtx.currentTime+0.05;
  const totalLen=notes.reduce((s,[,d])=>s+d*beat,0);
  notes.forEach(([freq,dur])=>{
    const o=audioCtx.createOscillator();
    const g=audioCtx.createGain();
    // 화음 추가 (5도 위)
    const o2=audioCtx.createOscillator();
    const g2=audioCtx.createGain();
    o.connect(g);g.connect(audioCtx.destination);
    o2.connect(g2);g2.connect(audioCtx.destination);
    o.type='triangle';o.frequency.value=freq;
    o2.type='sine';o2.frequency.value=freq*1.5;
    const len=dur*beat;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(0.13,t+0.02);
    g.gain.linearRampToValueAtTime(0.1,t+len*0.7);
    g.gain.linearRampToValueAtTime(0,t+len);
    g2.gain.setValueAtTime(0,t);
    g2.gain.linearRampToValueAtTime(0.04,t+0.02);
    g2.gain.linearRampToValueAtTime(0,t+len);
    o.start(t);o.stop(t+len);
    o2.start(t);o2.stop(t+len);
    t+=len;
  });
  musicInterval=setTimeout(scheduleMelody,(totalLen-0.1)*1000);
}

function playCorrectSound(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    if(ctx.state==='suspended')ctx.resume();
    [523,659,784,1047].forEach((f,i)=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.type='sine';o.frequency.value=f;
      const t=ctx.currentTime+i*0.09;
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(0.2,t+0.02);
      g.gain.linearRampToValueAtTime(0,t+0.18);
      o.start(t);o.stop(t+0.22);
    });
  }catch(e){}
}

function playWrongSound(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    if(ctx.state==='suspended')ctx.resume();
    [280,220].forEach((f,i)=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.type='sawtooth';o.frequency.value=f;
      const t=ctx.currentTime+i*0.18;
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(0.12,t+0.02);
      g.gain.linearRampToValueAtTime(0,t+0.22);
      o.start(t);o.stop(t+0.25);
    });
  }catch(e){}
}

/* ---- BEAR ---- */
function bearSize(){return 70+score*9;}
function growMsg(){
  if(score===0)return '문제를 맞혀서 곰돌이를 키워봐!';
  if(score<=4)return `조금 자랐어요! (${score}점)`;
  if(score<=9)return `점점 커지고 있어요! (${score}점)`;
  if(score<=14)return `우와 많이 컸어요! (${score}점)`;
  if(score<=19)return `거의 완전 성장! (${score}점)`;
  return `숙명 곰돌이 초대형 성장 중! (${score}점) ★`;
}

function bearSVG(sz){
  return `<svg width="${sz}" height="${Math.round(sz*1.15)}" viewBox="0 0 120 138" xmlns="http://www.w3.org/2000/svg">
  <circle cx="34" cy="32" r="13" fill="#EDE0CC"/>
  <circle cx="34" cy="32" r="8" fill="#D9C4A8"/>
  <circle cx="86" cy="32" r="13" fill="#EDE0CC"/>
  <circle cx="86" cy="32" r="8" fill="#D9C4A8"/>
  <ellipse cx="60" cy="56" rx="32" ry="30" fill="#EDE0CC"/>
  <circle cx="48" cy="50" r="5" fill="#1a1a1a"/>
  <circle cx="72" cy="50" r="5" fill="#1a1a1a"/>
  <circle cx="49.5" cy="48.5" r="1.8" fill="white"/>
  <circle cx="73.5" cy="48.5" r="1.8" fill="white"/>
  <ellipse cx="60" cy="62" rx="7" ry="5" fill="#7a4a2a"/>
  <path d="M53 67 Q60 74 67 67" stroke="#7a4a2a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M79 20 Q86 13 91 20 Q86 27 79 20Z" fill="#F4A7C0"/>
  <path d="M91 20 Q98 13 103 20 Q98 27 91 20Z" fill="#F4A7C0"/>
  <circle cx="91" cy="20" r="3.5" fill="#E8769A"/>
  <ellipse cx="60" cy="107" rx="32" ry="30" fill="#EDE0CC"/>
  <path d="M28 95 Q28 133 60 136 Q92 133 92 95 L84 86 Q72 100 60 100 Q48 100 36 86 Z" fill="#555060"/>
  <ellipse cx="60" cy="100" rx="11" ry="15" fill="#ffffff"/>
  <path d="M36 86 Q45 94 54 90 L60 100 L48 93 Z" fill="#443d50"/>
  <path d="M84 86 Q75 94 66 90 L60 100 L72 93 Z" fill="#443d50"/>
  <circle cx="60" cy="108" r="3" fill="#222"/>
  <circle cx="60" cy="117" r="3" fill="#222"/>
  <path d="M30 122 Q36 130 42 122 Q48 130 54 122 Q60 130 66 122 Q72 130 78 122 Q84 130 90 122 L92 133 Q60 140 28 133 Z" fill="#555060"/>
  <circle cx="73" cy="92" r="7" fill="white" stroke="#bbb" stroke-width="0.8"/>
  <circle cx="73" cy="92" r="5" fill="#2d7a3a"/>
  <text x="73" y="95" text-anchor="middle" font-size="4.5" fill="white" font-weight="bold" font-family="sans-serif">숙명</text>
  <ellipse cx="26" cy="108" rx="10" ry="18" fill="#EDE0CC" transform="rotate(-12 26 108)"/>
  <ellipse cx="94" cy="108" rx="10" ry="18" fill="#EDE0CC" transform="rotate(12 94 108)"/>
  <ellipse cx="20" cy="120" rx="8" ry="5" fill="#555060" transform="rotate(-12 20 120)"/>
  <ellipse cx="100" cy="120" rx="8" ry="5" fill="#555060" transform="rotate(12 100 120)"/>
  <ellipse cx="46" cy="134" rx="12" ry="7" fill="#EDE0CC"/>
  <ellipse cx="74" cy="134" rx="12" ry="7" fill="#EDE0CC"/>
</svg>`;
}

/* ---- GAME LOGIC ---- */
function shuffle(a){let r=[...a];for(let i=r.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}

function setMode(m){
  mode=m;
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',['mc_name','mc_sym','fill','table'][i]===m));
  if(m==='table')renderTable();else startQuiz();
}

function startQuiz(reviewOnly=false){
  isReviewMode=reviewOnly;
  if(reviewOnly){queue=shuffle([...wrongList]);wrongList=[];}
  else{queue=shuffle([...els]);wrongList=[];score=0;streak=0;updateScore();}
  qIdx=0;answered=false;renderQ();
}

function renderQ(){
  if(qIdx>=queue.length){renderResult();return;}
  answered=false;
  const el=queue[qIdx];
  const area=document.getElementById('gameArea');
  const prog=Math.round((qIdx/queue.length)*100);
  const sz=bearSize();
  const bearBlock=`<div class="bear-wrap" id="bearWrap" style="transition:transform 0.3s;">${bearSVG(sz)}<div class="grow-msg">${growMsg()}</div></div>`;
  const reviewBanner=isReviewMode?`<div class="review-mode-banner">📝 오답 복습 모드! 틀린 문제만 다시 풀어요</div>`:'';

  if(mode==='fill'){
    fillTarget=el;
    area.innerHTML=`
      ${reviewBanner}
      <div class="progress-bar"><div class="progress-fill" style="width:${prog}%"></div></div>
      <div class="q-label">${qIdx+1} / ${queue.length}</div>
      ${bearBlock}
      <div class="q-main">원자번호 <b>${el.n}</b>번 (${el.sym})<br>한국어 이름은?</div>
      <input class="fill-input" id="fAns" placeholder="예: 수소" onkeydown="if(event.key==='Enter')checkFill()" autofocus/>
      <button class="submit-btn" onclick="checkFill()">확인</button>
      <div id="fb"></div>`;
  } else {
    const correct=mode==='mc_name'?el.name:el.sym;
    const wrongs=shuffle(els.filter(e=>e.n!==el.n)).slice(0,3).map(e=>mode==='mc_name'?e.name:e.sym);
    const opts=shuffle([correct,...wrongs]);
    const q=mode==='mc_name'?`원자번호 <b>${el.n}</b>번 원소의 이름은?`:`원자번호 <b>${el.n}</b>번 원소의 기호는?`;
    area.innerHTML=`
      ${reviewBanner}
      <div class="progress-bar"><div class="progress-fill" style="width:${prog}%"></div></div>
      <div class="q-label">${qIdx+1} / ${queue.length}</div>
      ${bearBlock}
      <div class="q-main">${q}</div>
      <div class="options">${opts.map(o=>`<button class="opt" onclick="checkMC(this,'${o}','${correct}')">${o}</button>`).join('')}</div>
      <div id="fb"></div>`;
  }
}

function checkMC(btn,chosen,correct){
  if(answered)return;answered=true;
  document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.textContent===correct)b.classList.add('correct');});
  const ok=chosen===correct;
  if(ok){btn.classList.add('correct');score++;streak++;playCorrectSound();}
  else{btn.classList.add('wrong');streak=0;wrongList.push(queue[qIdx]);playWrongSound();}
  updateScore();
  document.getElementById('fb').innerHTML=ok
    ?`<div class="feedback fb-ok">정답! 곰돌이가 자랐어요! +1점 (연속 ${streak})</div>`
    :`<div class="feedback fb-no">틀렸어요. 정답: <b>${correct}</b></div>`;
  if(ok)bounceBear();
  document.getElementById('gameArea').insertAdjacentHTML('beforeend','<button class="next-btn" onclick="nextQ()">다음 문제 →</button>');
}

function checkFill(){
  if(answered)return;
  const inp=document.getElementById('fAns');
  const val=inp.value.trim();
  if(!val)return;
  answered=true;
  const el=fillTarget;inp.disabled=true;
  const ok=val===el.name||val===el.sym;
  if(ok){score++;streak++;inp.style.borderColor='#3B6D11';inp.style.background='#eaf3de';playCorrectSound();}
  else{streak=0;inp.style.borderColor='#A32D2D';inp.style.background='#fcebeb';wrongList.push(el);playWrongSound();}
  updateScore();
  document.getElementById('fb').innerHTML=ok
    ?`<div class="feedback fb-ok">정답! 곰돌이가 자랐어요! +1점 (연속 ${streak})</div>`
    :`<div class="feedback fb-no">틀렸어요. 정답: <b>${el.name}</b> (${el.sym})</div>`;
  if(ok)bounceBear();
  document.getElementById('gameArea').insertAdjacentHTML('beforeend','<button class="next-btn" onclick="nextQ()">다음 문제 →</button>');
}

function bounceBear(){
  const w=document.getElementById('bearWrap');
  if(!w)return;
  w.style.transform='scale(1.2) rotate(-5deg)';
  setTimeout(()=>{w.style.transform='scale(1.1) rotate(5deg)';},150);
  setTimeout(()=>{w.style.transform='scale(1)';},300);
}

function nextQ(){qIdx++;renderQ();}
function updateScore(){document.getElementById('scoreDisp').textContent=score;document.getElementById('streakDisp').textContent=streak;}

function renderResult(){
  const total=isReviewMode?queue.length:els.length;
  const pct=Math.round((score/total)*100);
  const msg=pct===100?'완벽! 전부 맞혔어요! 🎉':pct>=80?'훌륭해요! 거의 다 외웠어요.':pct>=60?'절반 이상! 조금만 더!':'다시 도전해봐요!';
  const sz=bearSize();
  const hasWrong=wrongList.length>0;
  const wrongItems=hasWrong?`
    <div class="review-section">
      <div class="review-title">❌ 틀린 문제 (${wrongList.length}개)</div>
      ${wrongList.map(e=>`<div class="review-item"><div class="ri-num">${e.n}</div><div class="ri-info"><div class="ri-sym">${e.sym}</div><div class="ri-name">${e.name}</div></div></div>`).join('')}
    </div>
    <div class="btn-row">
      <button class="btn-half btn-retry-wrong" onclick="startQuiz(true)">틀린 것만 다시</button>
      <button class="btn-half btn-restart" onclick="startQuiz(false)">처음부터</button>
    </div>`
  :`<button class="next-btn" style="margin-top:16px;" onclick="startQuiz(false)">다시 도전!</button>`;
  document.getElementById('gameArea').innerHTML=`
    <div class="result-wrap">
      <div class="bear-wrap">${bearSVG(sz)}<div class="grow-msg">${growMsg()}</div></div>
      <div class="result-score">${score} / ${total}</div>
      <div style="font-size:15px;color:#666;margin-bottom:4px;">${msg}</div>
      ${wrongItems}
    </div>`;
}

function renderTable(){
  document.getElementById('gameArea').innerHTML=`
    <div style="font-size:13px;color:#aaa;margin-bottom:10px;text-align:center;">1~20번 원소 전체 보기</div>
    <div class="tbl-grid">${els.map(e=>`<div class="tbl-cell"><div class="tn">${e.n}</div><div class="ts">${e.sym}</div><div class="tk">${e.name}</div></div>`).join('')}</div>
    <button class="next-btn" style="margin-top:16px;" onclick="setMode('mc_name')">퀴즈 시작!</button>`;
}

startQuiz();
</script>
