<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="속담대모험">
<meta name="theme-color" content="#06231c">
<title>조고숭의 속담 대모험 - 조민규영어</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/*
VOICE  : 정글 오락실 배틀 — 신나고 빠르게, 그러나 문제 글씨는 또렷하게
IDEA   : 조고숭이 바나나를 던져 '까먹 몬스터'를 물리치는 아케이드 게임기
PICTURE: 정글 무대(아레나) 위 조고숭 vs 몬스터, 파티클·흔들림·K.O.
COLOUR : 깊은 정글 녹색 바탕 + 황금 바나나색 강조 + 학원 파랑 버튼
TYPE   : Black Han Sans 제목 / Jua 안내 / Fredoka 영어 문장
*/
:root{--jg0:#041a14;--jg1:#072b22;--jg2:#0f4d3a;--leaf:#1f7a4d;--gold:#ffcc33;--gold2:#ff9f1c;--blue:#2f7bff;--blue2:#1d55d6;--pink:#ff4f8b;--ok:#22c47a;--no:#ff4d5e;--ink:#1b2440;--sub:#5d6886;--paper:#fffdf6;--line:#0b3328}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;min-width:0}
html,body{height:100%}
body{font-family:'Jua','Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;color:var(--ink);background:var(--jg1);overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;color:inherit}
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(120% 70% at 50% 0%,#2a8a66 0%,#0f4d3a 45%,#06231c 100%);transition:filter .6s}
#bg svg{position:absolute;left:0;width:100%}
#bg .vines{top:0;height:150px;animation:sway 6s ease-in-out infinite;transform-origin:top center}
#bg .far{bottom:0;height:46%}
#bg .front{bottom:0;height:34%;animation:sway2 7s ease-in-out infinite;transform-origin:bottom center}
@keyframes sway{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1deg)}}
@keyframes sway2{0%,100%{transform:skewX(-1.5deg)}50%{transform:skewX(1.5deg)}}
body.fever #bg{filter:hue-rotate(-70deg) saturate(1.6) brightness(1.15);animation:pulsebg .5s ease-in-out infinite alternate}
@keyframes pulsebg{to{filter:hue-rotate(-110deg) saturate(1.9) brightness(1.3)}}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:40;pointer-events:none}
#flash{position:fixed;inset:0;z-index:39;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,transparent 40%,rgba(255,40,60,.75))}
#ov{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;pointer-events:none}
#ov.on{display:flex}
#ov b{font-family:'Black Han Sans',sans-serif;font-size:min(30vw,190px);color:var(--gold);-webkit-text-stroke:6px var(--line);paint-order:stroke fill;text-shadow:0 10px 0 var(--line),0 0 60px rgba(255,204,51,.7)}
.ban{position:fixed;left:50%;top:40%;z-index:45;pointer-events:none;font-family:'Black Han Sans',sans-serif;font-size:clamp(40px,12vw,84px);white-space:nowrap;color:#fff;-webkit-text-stroke:5px var(--line);paint-order:stroke fill;text-shadow:0 7px 0 var(--line)}
.ban small{display:block;text-align:center;font-family:'Jua';font-size:18px;-webkit-text-stroke:0;text-shadow:0 2px 0 var(--line);color:#fff}
#app{position:relative;z-index:10;max-width:720px;margin:0 auto;min-height:100vh;padding:12px 12px 40px}
/* 공통 판 */
.panel{background:var(--paper);border-radius:22px;border:3px solid var(--line);box-shadow:0 6px 0 var(--line),0 16px 30px rgba(0,0,0,.35)}
.top{display:flex;align-items:center;gap:7px;margin-bottom:10px}
.ib{width:44px;height:44px;flex:none;border-radius:14px;background:var(--paper);border:3px solid var(--line);box-shadow:0 4px 0 var(--line);font-size:19px;display:flex;align-items:center;justify-content:center}
.ib:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.ttl{flex:1;font-family:'Black Han Sans';font-size:18px;color:#fff;text-shadow:0 3px 0 var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chipH{background:rgba(4,26,20,.72);color:#fff;border:2px solid rgba(255,255,255,.18);border-radius:99px;padding:6px 11px;font-size:15px;white-space:nowrap}
.chipH b{color:var(--gold);font-family:'Fredoka';font-weight:700}
/* 홈 */
.home-hero{position:relative;display:flex;align-items:flex-end;gap:4px;padding:8px 4px 0}
.logo{flex:1;padding-bottom:16px}
.logo span{display:block;font-family:'Black Han Sans';font-size:26px;color:#d6ffe9;text-shadow:0 3px 0 var(--line)}
.logo b{display:block;font-family:'Black Han Sans';font-weight:400;font-size:clamp(40px,11vw,60px);line-height:1;background:linear-gradient(180deg,#fff6c2 0%,#ffd23f 45%,#ff9f1c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:2px var(--line);filter:drop-shadow(0 5px 0 var(--line))}
.logo em{display:inline-block;margin-top:8px;font-style:normal;background:rgba(4,26,20,.75);color:#bff5d9;border-radius:99px;padding:5px 12px;font-size:14px}
.photo{position:absolute;right:6px;top:2px;width:62px;height:62px;border-radius:50%;border:4px solid var(--gold);box-shadow:0 4px 0 var(--line);object-fit:cover;animation:bob 3s ease-in-out infinite}
.home-hero .doll{width:150px;height:175px;flex:none;filter:drop-shadow(0 8px 0 rgba(0,0,0,.25))}
.say{position:relative;margin:2px 0 12px;background:var(--paper);border:3px solid var(--line);border-radius:18px;padding:10px 14px;font-size:16px;box-shadow:0 4px 0 var(--line)}
.prog{padding:12px 14px;margin-bottom:12px}
.prow{display:flex;justify-content:space-between;align-items:center;font-size:16px}
.prow b{font-family:'Fredoka';font-size:20px;color:var(--blue2)}
.pbar{height:16px;border-radius:99px;background:#e2e8d8;border:2px solid var(--line);overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;background:repeating-linear-gradient(-45deg,#ffd23f 0 10px,#ffbf1f 10px 20px);border-right:2px solid var(--line);transition:width .5s}
.namebox{display:flex;gap:6px;margin-top:10px}
.namebox input{flex:1;font-family:'Jua';font-size:16px;border:2.5px solid #c9d3bd;border-radius:12px;padding:8px 10px;background:#fff}
.h2{font-family:'Black Han Sans';font-size:19px;color:#fff;text-shadow:0 3px 0 var(--line);margin:16px 4px 9px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:rgba(255,255,255,.92);border:2.5px solid var(--line);border-radius:99px;padding:8px 13px;font-size:15px;box-shadow:0 3px 0 var(--line)}
.chip.on{background:var(--gold);box-shadow:0 3px 0 var(--line),0 0 0 3px rgba(255,204,51,.35)}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.mode{position:relative;text-align:left;border-radius:20px;padding:13px 12px 12px;border:3px solid var(--line);box-shadow:0 6px 0 var(--line);color:#fff;overflow:hidden;min-height:118px;transition:transform .1s}
.mode:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.mode:after{content:'';position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.35),transparent 45%);pointer-events:none}
.mode .ic{font-size:30px;display:block;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
.mode b{display:block;font-family:'Black Han Sans';font-weight:400;font-size:20px;margin:4px 0 2px;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.mode span{display:block;font-size:13px;opacity:.95;line-height:1.35}
.mode .best{margin-top:6px;display:inline-block;background:rgba(0,0,0,.25);border-radius:99px;padding:2px 9px;font-family:'Fredoka';font-size:12.5px}
.m-card{background:linear-gradient(140deg,#4f9bff,#2457d6)}.m-mem{background:linear-gradient(140deg,#ff8ab3,#e0457f)}
.m-quiz{background:linear-gradient(140deg,#ffcf3f,#ff8a1c);color:#3a2400}.m-ox{background:linear-gradient(140deg,#5be3a0,#16a36a)}
.m-order{background:linear-gradient(140deg,#b18cff,#6b46d9)}.m-blank{background:linear-gradient(140deg,#4fd6e8,#1789a8)}
.m-boss{grid-column:1/-1;min-height:104px;background:linear-gradient(120deg,#2b0f45,#6a1b6b 55%,#b0213f);}
.m-boss .ic{font-size:40px;position:absolute;right:16px;top:50%;transform:translateY(-50%);animation:bob 1.6s ease-in-out infinite}
.dex{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.dx{background:rgba(255,253,246,.95);border:2.5px solid var(--line);border-radius:14px;padding:9px 10px;text-align:left;box-shadow:0 3px 0 var(--line);font-size:13px;line-height:1.35}
.dx .e{font-size:20px}.dx .s{float:right;color:var(--gold2);font-size:13px;letter-spacing:-1px}
.dx b{display:block;font-family:'Fredoka';font-weight:600;font-size:14px;margin:2px 0;color:var(--ink)}
.dx.lock{opacity:.62}
.foot{text-align:center;color:#bfe8d3;font-size:13px;margin-top:22px;line-height:1.6}
/* 아레나 */
.arena{position:relative;height:200px;border-radius:22px;border:3px solid var(--line);box-shadow:0 6px 0 var(--line);overflow:hidden;background:linear-gradient(180deg,#8fe0ff 0%,#c8f2ff 45%,#9be29a 46%,#4fb36a 100%)}
body.fever .arena{background:linear-gradient(180deg,#ff9a3d 0%,#ffd36b 45%,#ffb24d 46%,#e05d2a 100%)}
.arena .sun{position:absolute;left:44%;top:14px;width:56px;height:56px;border-radius:50%;background:radial-gradient(circle,#fff7c2,#ffd23f 60%,rgba(255,210,63,0) 72%);animation:bob 4s ease-in-out infinite}
.arena .hill{position:absolute;bottom:52px;width:200px;height:70px;border-radius:50%;background:#6cc77f}
.arena .tree{position:absolute;bottom:60px;font-size:40px}
.arena .floor{position:absolute;left:0;right:0;bottom:0;height:56px;background:repeating-linear-gradient(90deg,#3f9a58 0 30px,#47a862 30px 60px);border-top:3px solid var(--line)}
.hero{position:absolute;left:3%;bottom:6px;width:120px;height:160px}
.hero .doll{width:100%;height:100%}.home-hero .doll img{height:200px}
.enemy{position:absolute;right:5%;bottom:14px;width:128px;height:128px}
.enemy svg{width:100%;height:100%;overflow:visible}
.boss .enemy{width:150px;height:150px;bottom:10px}
.idle{animation:bob 1.8s ease-in-out infinite}
.e-idle{animation:ebob 1.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes ebob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-8px) scale(.97,1.04)}}
.lives{position:absolute;left:10px;top:8px;display:flex;gap:2px;font-size:22px;z-index:3}
.lives i{font-style:normal;filter:drop-shadow(0 2px 0 rgba(0,0,0,.3))}
.lives i.off{filter:grayscale(1) opacity(.35)}
.mon-tag{position:absolute;right:10px;top:8px;width:46%;z-index:3;text-align:right}
.mon-tag .nm{font-family:'Black Han Sans';font-size:15px;color:#fff;-webkit-text-stroke:3px var(--line);paint-order:stroke fill}
.mon-tag .nm small{font-family:'Fredoka';font-size:12px;color:var(--gold);-webkit-text-stroke:3px var(--line);paint-order:stroke fill;margin-left:4px}
.hp{height:14px;border-radius:99px;background:#3b1830;border:2.5px solid var(--line);overflow:hidden;margin-top:3px}
.hp i{display:block;height:100%;background:linear-gradient(180deg,#ff8aa8,#ff3d6b);transition:width .35s cubic-bezier(.3,1.6,.6,1)}
.dmg{position:absolute;z-index:6;font-family:'Black Han Sans';font-size:34px;color:#fff;-webkit-text-stroke:4px #b0213f;paint-order:stroke fill;pointer-events:none;white-space:nowrap}
.proj{position:absolute;z-index:5;font-size:34px;pointer-events:none;left:0;top:0}
.hud2{display:flex;gap:7px;align-items:center;margin:10px 0 8px}
.combo{flex:1;background:rgba(4,26,20,.72);border:2px solid rgba(255,255,255,.18);border-radius:14px;padding:5px 10px;color:#fff;display:flex;align-items:center;gap:8px}
.combo b{font-family:'Fredoka';font-weight:700;font-size:18px;color:var(--gold);min-width:68px}
.cbar{flex:1;height:10px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
.cbar i{display:block;height:100%;background:linear-gradient(90deg,#ffd23f,#ff5f2e,#ff2e7e);transition:width .25s}
body.fever .combo{border-color:#ffcc33;box-shadow:0 0 18px rgba(255,140,40,.8)}
.tbar{height:12px;border-radius:99px;background:rgba(4,26,20,.6);border:2px solid var(--line);overflow:hidden;margin-bottom:10px}
.tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#5be3a0,#ffd23f)}
.tbar.low i{background:linear-gradient(90deg,#ff4d5e,#ff9f1c);animation:blink .3s infinite alternate}
@keyframes blink{to{opacity:.55}}
/* 문제 */
.qp{padding:16px 14px 14px;position:relative}
.qlbl{display:inline-block;background:var(--line);color:#bff5d9;border-radius:99px;padding:3px 12px;font-size:13.5px;margin-bottom:8px}
.qhead{display:flex;align-items:center;gap:10px}
.qemo{font-size:42px;flex:none;filter:drop-shadow(0 3px 0 rgba(0,0,0,.15))}
.qkr{font-size:19px;line-height:1.45;color:var(--ink)}
.qen{font-family:'Fredoka';font-weight:600;font-size:21px;line-height:1.45;color:var(--ink)}
.blank{display:inline-block;min-width:72px;border-bottom:4px solid var(--blue);color:var(--blue);text-align:center}
.opts{display:grid;gap:9px;margin-top:14px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;background:#fff;border:3px solid var(--line);border-radius:16px;padding:11px 12px;box-shadow:0 4px 0 var(--line);font-family:'Fredoka';font-weight:600;font-size:16.5px;line-height:1.3;color:var(--ink);transition:transform .08s}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt .k{flex:none;width:30px;height:30px;border-radius:9px;background:var(--line);color:var(--gold);font-size:15px;display:flex;align-items:center;justify-content:center}
.opt.ok{background:#d9fbe9;border-color:#0c7a4a;box-shadow:0 4px 0 #0c7a4a,0 0 0 4px rgba(34,196,122,.35)}
.opt.ok .k{background:#0c7a4a;color:#fff}
.opt.no{background:#ffe1e4;border-color:#b0213f;box-shadow:0 4px 0 #b0213f;animation:shake .4s}
.opt[disabled]{cursor:default}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.ox{display:flex;gap:12px;margin-top:16px}
.ox button{flex:1;height:96px;border-radius:22px;border:3px solid var(--line);font-family:'Black Han Sans';font-size:58px;box-shadow:0 6px 0 var(--line);color:#fff;-webkit-text-stroke:3px var(--line);paint-order:stroke fill}
.ox .o{background:linear-gradient(160deg,#6aa8ff,#2457d6)}.ox .x{background:linear-gradient(160deg,#ff8a8a,#d92d4b)}
.ox button:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.slot{min-height:66px;margin-top:14px;padding:8px;border-radius:16px;border:3px dashed #9fb39a;background:#f3f7ea;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.slot.bad{border-color:var(--no);animation:shake .4s}
.pool{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:12px}
.tile{font-family:'Fredoka';font-weight:600;font-size:17px;background:#fff;border:2.5px solid var(--line);border-radius:12px;padding:7px 11px;box-shadow:0 3px 0 var(--line);animation:pop .25s ease}
.slot .tile{background:var(--blue);color:#fff}
@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}
.inp{display:flex;gap:8px;margin-top:14px}
.inp input{flex:1;font-family:'Fredoka';font-size:20px;padding:11px 13px;border-radius:14px;border:3px solid var(--line);outline:none;background:#fff}
.inp input:focus{box-shadow:0 0 0 4px rgba(47,123,255,.3)}
.btn{font-family:'Black Han Sans';font-size:18px;color:#fff;background:linear-gradient(180deg,#4f94ff,#1d55d6);border:3px solid var(--line);border-radius:16px;padding:11px 18px;box-shadow:0 5px 0 var(--line)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.btn.y{background:linear-gradient(180deg,#ffe066,#ffb21c);color:#3a2400}
.btn.w{background:#fff;color:var(--ink)}
.btn.r{background:linear-gradient(180deg,#ff9a6b,#e0533a)}
.row{display:flex;gap:8px;margin-top:12px}.row>*{flex:1}
.fb{display:none;margin-top:12px;border-radius:16px;padding:11px 13px;font-size:15px;line-height:1.55;border:2.5px solid var(--line)}
.fb.show{display:block;animation:pop .25s}
.fb.ok{background:#e3fbef}.fb.no{background:#fff0f1}
.fb .en{display:block;font-family:'Fredoka';font-weight:700;font-size:17px;margin:2px 0}
.fb .hint{display:block;margin-top:6px;background:#fff4c7;border-radius:10px;padding:6px 9px;font-size:14px;color:#5a4300}
.fb .fake{display:block;font-family:'Fredoka';color:#b0213f;text-decoration:line-through;margin-bottom:3px}
.next{display:none;width:100%;margin-top:12px}
.next.show{display:block}
.sp{background:#fff;border:2px solid var(--line);border-radius:10px;padding:4px 9px;font-size:15px;margin-top:7px}
/* 카드 */
.flipwrap{perspective:1000px;margin-top:6px}
.flip{position:relative;height:340px;transition:transform .55s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d;cursor:pointer}
.flip.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center}
.face.b{transform:rotateY(180deg);background:#f4fbef}
.face .n{position:absolute;top:12px;left:16px;color:var(--sub);font-size:14px}
.face .st{position:absolute;top:10px;right:14px;color:var(--gold2);font-size:17px}
.face .tap{position:absolute;bottom:12px;color:var(--sub);font-size:13px}
/* 짝맞추기 */
.mem{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:10px}
.mc{height:110px;perspective:700px;background:none;padding:0}
.mc .in{position:relative;width:100%;height:100%;transition:transform .45s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.mc.open .in,.mc.done .in{transform:rotateY(180deg)}
.mc .fa,.mc .fb2{position:absolute;inset:0;border-radius:16px;border:3px solid var(--line);box-shadow:0 4px 0 var(--line);backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center;padding:6px;text-align:center}
.mc .fa{background:linear-gradient(140deg,#ffd23f,#ff9f1c);font-size:34px}
.mc .fb2{transform:rotateY(180deg);background:#fff;font-family:'Fredoka';font-weight:600;font-size:13.5px;line-height:1.25;color:var(--ink)}
.mc .fb2.A{background:#e6efff}.mc .fb2.B{background:#fff3d6}
.mc.done .fb2{background:#d9fbe9;border-color:#0c7a4a}
/* 결과 */
.res{text-align:center;padding:18px 14px}
.grade{display:inline-flex;align-items:center;justify-content:center;width:120px;height:120px;border-radius:50%;font-family:'Black Han Sans';font-size:76px;color:#fff;-webkit-text-stroke:4px var(--line);paint-order:stroke fill;border:5px solid var(--line);box-shadow:0 6px 0 var(--line);margin:4px 0 8px}
.gS{background:radial-gradient(circle at 35% 30%,#fff3a8,#ffbf1f 55%,#ff8a00)}.gA{background:radial-gradient(circle at 35% 30%,#c9dcff,#4f94ff 60%,#1d55d6)}
.gB{background:radial-gradient(circle at 35% 30%,#c8f7dc,#3cc985 60%,#13894f)}.gC{background:radial-gradient(circle at 35% 30%,#ffe0c2,#ff9a5a 60%,#d9622a)}.gD{background:radial-gradient(circle at 35% 30%,#e5e5ea,#9a9ab0 60%,#5e5e78)}
.stamp{animation:stamp .55s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stamp{from{transform:scale(3) rotate(-25deg);opacity:0}to{transform:scale(1) rotate(-8deg);opacity:1}}
.rt{font-family:'Black Han Sans';font-size:26px;color:var(--ink);margin:4px 0}
.big{font-family:'Fredoka';font-weight:700;font-size:46px;color:var(--blue2);line-height:1.1}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.stat{background:#f1f6e8;border:2.5px solid var(--line);border-radius:14px;padding:8px}
.stat b{display:block;font-family:'Fredoka';font-size:22px;color:var(--ink)}
.stat span{font-size:13px;color:var(--sub)}
.wl{text-align:left;margin-top:14px}
.wl div{background:#fff3f4;border:2px solid #f2c4c9;border-radius:12px;padding:8px 10px;margin-bottom:7px;font-size:14px;line-height:1.5}
.wl b{font-family:'Fredoka';font-size:15.5px}
.bub{flex:1;background:var(--paper);border:3px solid var(--line);border-radius:16px;padding:8px 12px;font-size:15px;box-shadow:0 3px 0 var(--line)}
.doll.real{height:100%;position:relative;display:flex;align-items:flex-end;justify-content:center}
.doll.real img{height:100%;width:auto;max-width:100%;object-fit:contain;filter:drop-shadow(0 6px 4px rgba(0,0,0,.35));-webkit-user-drag:none;user-select:none}
.doll.real.sad img{filter:drop-shadow(0 6px 4px rgba(0,0,0,.35)) saturate(.55) brightness(.9)}
.doll.real.happy img{filter:drop-shadow(0 6px 4px rgba(0,0,0,.35)) brightness(1.08) saturate(1.15)}
.dfx{position:absolute;pointer-events:none}
.dfx.tear{left:58%;top:16%;font-size:18px;animation:tear 1s ease-in infinite}
.dfx.spark{right:6%;top:0;font-size:22px;animation:twk .7s ease-in-out infinite alternate}
@keyframes tear{from{transform:translateY(0);opacity:1}to{transform:translateY(22px);opacity:0}}
@keyframes twk{from{transform:scale(.7) rotate(-10deg)}to{transform:scale(1.15) rotate(10deg)}}
.home-hero .doll{width:150px;height:200px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>

const RAW=[["Actions speak louder than words.","말보다 행동이 중요하다.","Actions speak","louder than words.","louder","🏃💬","행동(Actions)이 말(words)보다 더 크게(louder) 말한다! 비교급 louder + than","Words speak louder than actions."],["The grass is always greener on the other side.","남의 떡이 더 커 보인다.","The grass is always greener","on the other side.","greener","🌱🏡","저쪽(the other side) 잔디가 늘 더 푸르러(greener) 보인다 — 비교급 greener","The grass is always greener on this side."],["When in Rome, do as the Romans do.","로마에 가면 로마법을 따르라.","When in Rome,","do as the Romans do.","Romans","🏛️🍝","로마에선 로마 사람들(Romans)이 하는 대로(as) 해라","When in Rome, do as the Greeks do."],["The early bird catches the worm.","일찍 일어나는 새가 벌레를 잡는다.","The early bird","catches the worm.","worm","🐦🪱","bird는 단수 → catches (3인칭 단수 -es!)","The early bird catch the worm."],["People who live in glass houses shouldn't throw stones.","가랑잎이 솔잎더러 바스락거린다고 하는 격이다. 똥 묻은 개가 겨 묻은 개 나무란다.","People who live in glass houses","shouldn't throw stones.","stones","🏠🪨","유리집(glass houses)에 사는 사람은 돌(stones)을 던지면 안 된다 — 선행사 People(복수) + who live","People who lives in glass houses shouldn't throw stones."],["A picture is worth a thousand words.","백문이 불여일견","A picture is worth","a thousand words.","worth","🖼️💬","그림 한 장이 천 마디 말(a thousand words)만큼의 가치가 있다(be worth + 명사)","A picture is worth a hundred words."],["Where there's smoke, there's fire.","아니 땐 굴뚝에 연기 나랴.","Where there's smoke,","there's fire.","smoke","💨🔥","연기(smoke)가 있는 곳엔 불(fire)이 있다 — 순서 주의: smoke 먼저!","Where there's fire, there's smoke."],["Practice makes perfect.","연습은 완벽을 만든다.","Practice","makes perfect.","perfect","🎹💯","Practice(단수) → makes. make + 목적어 없이 perfect","Practice make perfect."],["A watched pot never boils.","서둔다고 일이 되는 것은 아니다.","A watched pot","never boils.","boils","🍲👀","지켜봄을 당하는(watched) 냄비는 절대 안 끓는다 — 과거분사 watched가 pot을 꾸밈, pot 단수라 boils","A watching pot never boils."],["Two heads are better than one.","백지장도 맞들면 낫다.","Two heads","are better than one.","heads","🧠🧠","머리 두 개(Two heads)가 하나보다 낫다 — 복수라 are, good의 비교급 better","Two heads are best than one."],["Out of sight, out of mind","눈에서 멀어지면, 마음도 멀어진다.","Out of sight,","out of mind","mind","🙈💭","눈(sight) 밖이면 마음(mind) 밖! out of 두 번 반복","Out of sight, out of heart"],["Honesty is the best policy.","정직이 최선의 방책이다.","Honesty","is the best policy.","policy","😇🏆","정직(Honesty)이 최고의 방책(policy) — 최상급 the best","Honesty is the better policy."],["There is no time like the present.","지금이 가장 좋은 때다.(지금이 적기다.)","There is no time","like the present.","present","⏰🎁","present = 현재, 지금! (선물 아님) 현재 같은 때는 없다","There is no time like the future."],["Two wrongs don't make a right.","악을 악으로 갚아봐야 좋을 게 없다.","Two wrongs","don't make a right.","right","❌❌","잘못 두 개(Two wrongs)를 더해도 옳은 것(a right)이 안 된다","Two rights don't make a wrong."],["A burnt child dreads the fire.","자라 보고 놀란 가슴 솥뚜껑 보고 놀란다.","A burnt child","dreads the fire.","dreads","🧒🔥","불에 덴(burnt) 아이는 불을 두려워한다(dreads) — burn-burnt-burnt, child 단수라 dreads","A burnt child dread the fire."],["Easy come, easy go.","쉽게 얻은 것은 쉽게 잃는다.","Easy come,","easy go.","go","💸🪽","쉽게 오면(come) 쉽게 간다(go) — easy 두 번!","Easy come, hard go."],["Rome wasn't built in a day.","가치 있는 일은 하루아침에 이루어지지 않는다.","Rome wasn't built","in a day.","built","🏛️🧱","로마는 '지어지지' 않았다 → 수동태 wasn't built","Rome didn't build in a day."],["The squeaky wheel gets the grease.","우는 아이 젖 준다.","The squeaky wheel","gets the grease.","grease","🛞🛢️","끼익(squeaky) 소리 내는 바퀴가 기름(grease)을 얻는다 → 우는 아이 젖 준다","The quiet wheel gets the grease."],["The pen is mightier than the sword.","펜은 칼보다 강하다.","The pen","is mightier than the sword.","mightier","🖊️⚔️","mighty → mightier (y를 i로!) 펜이 칼(sword)보다 강하다","The sword is mightier than the pen."],["Birds of a feather flock together.","유유상종. 가재는 게 편이다.","Birds of a feather","flock together.","flock","🐦🪶","같은 깃털(feather)의 새들이 함께 모인다(flock) — Birds 복수라 flock","Birds of a feather flocks together."],["When the going gets tough, the tough get going.","상황이 힘들어지면 강한 사람은 더 강해진다.","When the going gets tough,","the tough get going.","tough","💪🔥","going-tough / tough-going 자리 바꾸기! the tough = 강한 사람들(복수) → get","When the going gets easy, the tough get going."],["What goes around comes around.","뿌린 대로 거둔다.","What goes around","comes around.","comes","🔄🪃","돌아서 나간 것(What goes around)은 돌아온다(comes around) — What절 주어는 단수 → comes","What goes around come around."],["Every cloud has a silver lining.","하늘이 무너져도 솟아날 구멍이 있다.","Every cloud","has a silver lining.","silver","☁️✨","모든 먹구름(cloud) 뒤엔 은빛(silver) 테두리(lining)가 있다 — Every + 단수 → has","Every cloud has a golden lining."],["Don't judge a book by its cover.","겉만 보고 판단하지 마라.","Don't judge a book","by its cover.","cover","📖👀","책을 표지(cover)로 판단하지(judge) 마라 — its(그것의) ≠ it's","Don't judge a book by its title."],["Too many cooks spoil the broth.","사공이 많으면 배가 산으로 간다.","Too many cooks","spoil the broth.","broth","👨‍🍳🍲","요리사(cooks)가 너무 많으면 수프(broth)를 망친다(spoil) — cooks 복수라 spoil","Too many cooks spoils the broth."],["A stitch in time saves nine.","제때 꿰맨 한 땀이 아홉 번의 바느질을 던다.","A stitch in time","saves nine.","nine","🧵🪡","제때(in time) 한 땀(stitch)이 아홉(nine) 땀을 아낀다 — 조고숭이 제일 좋아하는 속담!","A stitch in time saves ten."],["Don't count your chickens before they hatch.","김칫국부터 마셔서는 안 된다.","Don't count your chickens","before they hatch.","hatch","🐣🥚","병아리(chickens)가 부화하기(hatch) 전에 세지 마라","Don't count your eggs before they hatch."],["It never rains but it pours.","설상가상. 비가 내렸다 하면 퍼붓는다.","It never rains","but it pours.","pours","🌧️⛈️","never A but B = A하면 반드시 B → 비가 왔다 하면 퍼붓는다(pours)","It never rains but it snows."],["Don't bite the hand that feeds you.","은혜를 원수로 갚지 마라.","Don't bite the hand","that feeds you.","feeds","🤚🐶","먹여 주는(feeds) 손을 물지(bite) 마라 — 주격 관계대명사 that + 단수 동사 feeds","Don't bite the hand that feed you."],["Beggars can't be choosers.","찬밥 더운밥 가릴 때가 아니다.","Beggars","can't be choosers.","choosers","🍚🙏","거지(Beggars)는 고르는 사람(choosers)이 될 수 없다","Choosers can't be beggars."],["Don't put all of your eggs in one basket.","한 가지 일에 모든 걸 걸지 말아라.","Don't put all of your eggs","in one basket.","basket","🥚🧺","달걀(eggs)을 전부(all of) 한 바구니(basket)에 담지 마라","Don't put all of your eggs in one box."],["A leopard cannot change its spots.","제 버릇 남 못 준다. 세 살 버릇 여든 간다.","A leopard cannot change","its spots.","spots","🐆","표범(leopard)은 자기 점무늬(spots)를 못 바꾼다 — its(그것의) ≠ it's(it is)","A leopard cannot change it's spots."],["A sound mind in a sound body","건강한 신체에 건강한 정신이 깃든다.","A sound mind","in a sound body","sound","🧠💪","sound = 건강한! (소리 아님) 건강한 몸(body) 안에 건강한 정신(mind)","A sound body in a sound mind"],["A friend in need is a friend indeed","어려울 때 친구가 진정한 친구이다.","A friend in need","is a friend indeed","indeed","🤝❤️","need-indeed 라임! 어려울 때(in need) 친구가 진짜(indeed) 친구","A friend indeed is a friend in need"],["Hit the sack","잠자리에 들다.","Hit","the sack","sack","🛏️💤","sack = 자루(침낭) — 자루에 몸을 던진다 = 자러 가다 (to go to bed)","Hit the bag"],["Break a leg","행운을 빌다.","Break","a leg","leg","🎭🍀","공연 전에 '다리 부러져라' = 행운을 빌어! (used to wish someone luck)","Break an arm"],["Call it a day","하던 일을 마무리하고 그만하다.","Call it","a day","day","🏁🌇","오늘은 이걸로 하루(a day)라고 치자 = 그만하자 (finished doing something)","Call him a day"],["Under the weather","몸이 안 좋다","Under","the weather","weather","🤒🌧️","궂은 날씨(weather) 아래 눌린 기분 = 몸이 안 좋다 (feel ill) — I'm under the weather.","Over the weather"],["Spill the beans","비밀을 털어놓다.","Spill","the beans","beans","🫘🤫","콩(beans)을 쏟다(spill) = 비밀을 털어놓다 (tell secret information)","Spill the peas"],["See eye to eye","의견이 일치하다.","See eye","to eye","eye","👀🤝","눈(eye)과 눈을 마주 본다 = 의견이 같다 (agree) — eye 단수 두 번!","See eyes to eyes"],["A piece of cake","식은 죽 먹기","A piece","of cake","cake","🍰😋","케이크 한 조각(a piece of cake)처럼 쉬운 일 — The puzzle was a piece of cake.","A piece of bread"],["The last straw","참을 수 있는 한계를 넘게 만든 마지막 일","The last","straw","straw","🐪🌾","낙타 등을 부러뜨린 마지막(last) 지푸라기(straw) 한 가닥","The first straw"],["cost an arm and a leg","매우 비싼","cost an arm","and a leg","arm","💸🦵","팔(arm) 하나에 다리(leg) 하나 값 = 엄청 비싸다 — That smartphone cost an arm and let AC=null;
function ac(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}return AC}
function tone(f,d,type='sine',v=.12,delay=0,slide=0){if(DB.mute)return;const A=ac();if(!A)return;try{const t=A.currentTime+delay,o=A.createOscillator(),g=A.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(A.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
function noise(d=.15,v=.15,delay=0,hp=800){if(DB.mute)return;const A=ac();if(!A)return;try{const n=A.sampleRate*d,b=A.createBuffer(1,n,A.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);const s=A.createBufferSource();s.buffer=b;const f=A.createBiquadFilter();f.type='highpass';f.frequency.value=hp;const g=A.createGain();g.gain.value=v;s.connect(f);f.connect(g);g.connect(A.destination);s.start(A.currentTime+delay)}catch(e){}}

const BGM={t:null,step:0};
const mtof=m=>440*Math.pow(2,(m-69)/12);
const BASS=[45,0,45,52,0,50,48,0, 43,0,43,50,0,48,47,0];
const LEAD=[69,72,74,76,79,81,84];
function bgmTick(){
 const fever=G&&G.combo>=5,boss=G&&G.mode==='boss';const tempo=fever?150:boss?128:116;
 const s=BGM.step%16,b=BASS[s];
 if(b)tone(mtof(b-(boss?2:0)),.2,'triangle',.07);
 if(s%2===1)noise(.03,fever?.05:.025,0,6000);
 if(s%4===0)noise(.06,.05,0,90);
 if(Math.random()<(fever?.75:.45))tone(mtof(pick(LEAD)+(fever?12:0)),.14,fever?'square':'triangle',fever?.035:.045);
 BGM.step++;BGM.t=setTimeout(bgmTick,60000/tempo/2);
}
function bgmStart(){if(DB.mute||BGM.t)return;ac();BGM.step=0;bgmTick()}
function bgmStop(){clearTimeout(BGM.t);BGM.t=null}

const FF=Array.from({length:16},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,a:Math.random()*6.28,s:.15+Math.random()*.35}));
function burst(x,y,cols,n=26,sp=7,o={}){for(let k=0;k<n&&PT.length<420;k++){const a=Math.random()*Math.PI*2,v=sp*(.35+Math.random()*.8);PT.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(o.up||2),g:o.g??.28,life:1,dec:.014+Math.random()*.02,sz:(o.sz||4)*(.6+Math.random()*.9),c:pick(cols),sh:o.sh||pick(['c','r','s']),r:Math.random()*6,vr:(Math.random()-.5)*.4,txt:o.txt})}}
function rain(cols,n=90,txt){for(let k=0;k<n;k++)PT.push({x:Math.random()*W,y:-20-Math.random()*H*.6,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,g:.06,life:1,dec:.004,sz:5+Math.random()*5,c:pick(cols),sh:txt?'t':'r',r:Math.random()*6,vr:(Math.random()-.5)*.3,txt})}
function loop(){
 cx.clearRect(0,0,W,H);
 for(const f of FF){f.a+=.02;f.x+=Math.cos(f.a)*f.s;f.y+=Math.sin(f.a*.7)*f.s-.1;if(f.y<-10)f.y=H+10;const al=.35+.35*Math.sin(f.a*2);cx.fillStyle=`rgba(255,240,140,${al})`;cx.beginPath();cx.arc(f.x,f.y,2.2,0,7);cx.fill();cx.fillStyle=`rgba(255,240,140,${al*.18})`;cx.beginPath();cx.arc(f.x,f.y,7,0,7);cx.fill()}
 for(let i=PT.length-1;i>=0;i--){const p=PT[i];p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.vx*=.985;p.r+=p.vr;p.life-=p.dec;if(p.life<=0||p.y>H+40){PT.splice(i,1);continue}
  cx.save();cx.globalAlpha=Math.min(1,p.life*1.4);cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;
  if(p.sh==='c'){cx.beginPath();cx.arc(0,0,p.sz,0,7);cx.fill()}
  else if(p.sh==='r'){cx.fillRect(-p.sz,-p.sz*.5,p.sz*2,p.sz)}
  else if(p.sh==='t'){cx.font=(p.sz*3.2)+'px serif';cx.textAlign='center';cx.fillText(p.txt,0,0)}
  else{cx.beginPath();for(let k=0;k<5;k++){const a=k*1.2566-1.5708;cx.lineTo(Math.cos(a)*p.sz*1.4,Math.sin(a)*p.sz*1.4);const b=a+.6283;cx.lineTo(Math.cos(b)*p.sz*.6,Math.sin(b)*p.sz*.6)}cx.fill()}
  cx.restore()}
 requestAnimationFrame(loop)}

function banner(t,col='#fff',sub='',ms=1000){const e=document.createElement('div');e.className='ban';e.style.color=col;e.innerHTML=t+(sub?`<small>${sub}</small>`:'');document.body.appendChild(e);e.animate([{transform:'translate(-50%,-50%) scale(.3) rotate(-10deg)',opacity:0},{transform:'translate(-50%,-50%) scale(1.15) rotate(3deg)',opacity:1,offset:.25},{transform:'translate(-50%,-50%) scale(1) rotate(0)',opacity:1,offset:.75},{transform:'translate(-50%,-80%) scale(1)',opacity:0}],{duration:ms,easing:'ease-out'}).onfinish=()=>e.remove()}
async function countdown(){const o=$('#ov'),t=$('#ovt');o.classList.add('on');for(const s of ['3','2','1','GO!']){t.textContent=s;s==='GO!'?SFX.gogo():SFX.go();t.animate([{transform:'scale(2.4)',opacity:0},{transform:'scale(1)',opacity:1,offset:.35},{transform:'scale(.9)',opacity:1,offset:.8},{transform:'scale(.6)',opacity:0}],{duration:620,easing:'ease-out'});await wait(620)}o.classList.remove('on')}

 else if(m.t==='slime')body=`<path d="M10 90q-2-48 40-60q42 12 40 60q-10 6-18 0q-8 8-16 2q-8 7-16 0q-10 6-14 0q-8 5-16-2z" fill="url(#${id})" stroke="#1b1033" stroke-width="3.5" stroke-linejoin="round"/><ellipse cx="34" cy="42" rx="8" ry="5" fill="#fff" opacity=".45"/>`;
 else body=`<path d="M26 30l-8-20 18 12M74 30l8-20-18 12" fill="#ffe08a" stroke="#1b1033" stroke-width="3"/><path d="M12 60q-14-6-8 12q6 2 10-4M88 60q14-6 8 12q-6 2-10-4" fill="url(#${id})" stroke="#1b1033" stroke-width="3"/><ellipse cx="50" cy="60" rx="36" ry="33" fill="url(#${id})" stroke="#1b1033" stroke-width="3.5"/>`;
 const eyes=ko?`<path d="M33 50l10 10M43 50l-10 10M57 50l10 10M67 50l-10 10" stroke="#1b1033" stroke-width="4" stroke-linecap="round"/>`
  :hurt?`<path d="M32 50l10 5-10 5M68 50l-10 5 10 5" fill="none" stroke="#1b1033" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`
  :`<ellipse cx="38" cy="55" rx="9" ry="10" fill="#fff" stroke="#1b1033" stroke-width="2.5"/><ellipse cx="62" cy="55" rx="9" ry="10" fill="#fff" stroke="#1b1033" stroke-width="2.5"/><circle cx="40" cy="57" r="4.5" fill="#1b1033"/><circle cx="60" cy="57" r="4.5" fill="#1b1033"/><circle cx="41.5" cy="55" r="1.6" fill="#fff"/><circle cx="61.5" cy="55" r="1.6" fill="#fff"/><path d="M28 42l16 6M72 42l-16 6" stroke="#1b1033" stroke-width="4" stroke-linecap="round"/>`;
 const mouth=ko?`<ellipse cx="50" cy="76" rx="7" ry="5" fill="#1b1033"/>`:`<path d="M36 72q14 12 28 0z" fill="#3a1030" stroke="#1b1033" stroke-width="2.5" stroke-linejoin="round"/><path d="M41 73l3 5 3-5M53 73l3 5 3-5" fill="#fff"/>`;
 const crown=m.crown?`<path d="M30 22l6-16 8 10 6-14 6 14 8-10 6 16z" fill="#ffd23f" stroke="#1b1033" stroke-width="3" stroke-linejoin="round"/><circle cx="50" cy="10" r="3" fill="#ff4f8b"/>`:'';
 return `<svg viewBox="0 0 100 100"><defs><radialGradient id="${id}" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff"/><stop offset=".25" stop-color="${m.c1}"/><stop offset="1" stop-color="${m.c2}"/></radialGradient></defs><ellipse cx="50" cy="98" rx="30" ry="4" fill="#000" opacity=".2"/>${body}${crown}${eyes}${mouth}${hurt?'<circle cx="50" cy="55" r="44" fill="#fff" opacity=".55"/>':''}</svg>`;
}

let G={};
function home(){
 G={};bgmStop();clearTimeout(window.__auto);stopTimer();document.body.classList.remove('fever');
 const got=P.filter(p=>star(p.i)>=2).length,full=P.filter(p=>star(p.i)===3).length;
 const greet=DB.name?`${esc(DB.name)}! 오늘도 까먹 몬스터들을 물리치러 가자!`:'우끼! 나는 오랑우탄 조고숭이야. 바나나 던져서 까먹 몬스터 물리치자!';
 $('#app').innerHTML=`

 stopTimer();clearTimeout(window.__auto);SFX.tap();try{speechSynthesis.getVoices()}catch(e){}
 const idx=rangeIdx(RANGE);
 if(mode==='card')return cardMode(idx,at);

 <div class="face panel b"><span class="n">${p.no}</span><div style="font-size:40px">${p.e}</div><div class="qen" style="font-size:23px;margin-top:8px">${esc(p.en)}</div><div style="margin-top:8px;color:var(--sub);font-size:15px">${esc(p.kr)}</div><div class="fb show" style="background:#fff4c7;text-align:left;color:#5a4300">💡 ${esc(p.h)}</div><span class="tap">다시 눌러 앞면</span></div>
 </div></div>
 <div class="row"><button class="btn w" onclick="cardGo(-1)">◀</button><button class="btn w" onclick="say(P[${p.i}].en)">🔊 듣기</button><button class="btn w" onclick="cardGo(1)">▶</button></div>
 <div class="row"><button class="btn r" onclick="cardGo(1)">😵 아직</button><button class="btn y" onclick="cardKnow(${p.i})">😎 외웠어요 ★+1</button></div>
 <div style="display:flex;align-items:center;gap:8px;margin-top:12px"><div class="idle" style="width:90px;height:116px;flex:none">${doll('happy',0,0)}</div><div class="bub">${pick(['앞면 보고 영어로 먼저 말해 봐! 그다음 뒤집기!','소리 내서 세 번 따라 읽으면 오래 가!','💡 요령까지 읽으면 시험 함정도 피할 수 있어!'])}</div></div>`;
 let sx=null;const fl=$('#fl');fl.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});fl.addEventListener('touchend',e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>60){e.preventDefault();cardGo(dx<0?1:-1)}sx=null});
}
function cardKnow(i){addStar(i,1);SFX.ok();const b=event.target.getBoundingClientRect();burst(b.left+b.width/2,b.top,['#ffd23f','#fff'],22,6,{sh:'s'});setTimeout(()=>cardGo(1),350)}
function cardGo(d){SFX.tap();CD.k=(CD.k+d+CD.list.length)%CD.list.length;cardDraw()}
/* ===== 짝맞추기 ===== */
let MM={};
function memMode(idx){const sel=shuf(idx).slice(0,6);MM={sel,cards:shuf(sel.flatMap(i=>[{i,s:'A'},{i,s:'B'}])),open:[],done:{},moves:0,t0:Date.now(),lock:false,combo:0,score:0};memDraw();bgmStart()}
function memDraw(){
 const left=MM.sel.length-Object.keys(MM.done).length;
 $('#app').innerHTML=`${topBar('🃏 반쪽 짝맞추기',`<div class="chipH">남은 짝 <b>${left}</b></div>`)}
 <div style="display:flex;align-items:center;gap:8px"><div id="mhero" class="idle" style="width:84px;height:108px;flex:none">${doll('norm',0,0)}</div><div class="bub" id="bub">파란 카드 = 앞부분, 노란 카드 = 뒷부분! 짝을 찾아 줘</div></div>
 <div class="mem">${MM.cards.map((c,k)=>{const p=P[c.i];const st=MM.done[c.i]?'done':MM.open.includes(k)?'open':'';return `<button class="mc ${st}" id="mc${k}" onclick="memFlip(${k})"><div class="in"><div class="fa">${c.s==='A'?'🍌':'🥥'}</div><div class="fb2 ${c.s}">${esc(c.s==='A'?p.a+' …':'… '+p.b)}</div></div></button>`}).join('')}</div>
 <div class="chipH" style="display:inline-block;margin-top:12px">뒤집기 <b>${MM.moves}</b>번 · 콤보 <b>${MM.combo}</b></div>`;
}
function memFlip(k){
 if(MM.lock||MM.open.includes(k)||MM.done[MM.cards[k].i])return;SFX.tap();MM.open.push(k);$('#mc'+k).classList.add('open');
 if(MM.open.length<2)return;
 MM.moves++;MM.lock=true;const [a,b]=MM.open.map(x=>MM.cards[x]);
 if(a.i===b.i&&a.s!==b.s){
  MM.combo++;MM.score+=100+MM.combo*40;
  setTimeout(()=>{MM.done[a.i]=1;MM.open.forEach(x=>{const r=$('#mc'+x).getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,['#5be3a0','#ffd23f','#fff'],20,6)});MM.open=[];MM.lock=false;SFX.ok();say(P[a.i].en);memDraw();
   $('#bub').textContent=`${P[a.i].e} ${MM.combo>=2?MM.combo+'연속 성공!':'짝 찾았다!'}`;$('#mhero').innerHTML=doll('happy',0,0);
   if(Object.keys(MM.done).length===MM.sel.length)setTimeout(memEnd,800)},450);
 }else{
  MM.combo=0;
  setTimeout(()=>{MM.open.forEach(x=>{const e=$('#mc'+x);e.classList.remove('open');e.animate([{transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}],{duration:300})});MM.open=[];MM.lock=false;SFX.no();
   $('#bub').textContent=pick(['아깝다! 위치 기억해 둬','음… 그 짝이 아니야','다시 찾아보자!']);$('#mhero').innerHTML=doll('sad',0,0)},900);
 }
}
function memEnd(){
 bgmStop();const sec=Math.round((Date.now()-MM.t0)/1000);const score=Math.max(100,MM.score+600-MM.moves*15-sec*3);
 const key='mem'+RANGE,best=score>(DB.best[key]||0);if(best)DB.best[key]=score;save();SFX.win();rain(['#ffd23f','#ff4f8b','#5be3a0','#4f94ff'],100);
 const gr=MM.moves<=7?'S':MM.moves<=9?'A':MM.moves<=12?'B':'C';
 $('#app').innerHTML=`${topBar('결과')}<div class="panel res"><div class="grade g${gr} stamp">${gr}</div><div class="rt">짝 6개 모두 찾았다!</div><div class="big">${score}점</div>${best?'<div style="color:#e08a00;font-size:17px">🏆 최고 기록 갱신!</div>':''}
 <div class="stats"><div class="stat"><b>${MM.moves}</b><span>뒤집기</span></div><div class="stat"><b>${sec}초</b><span>걸린 시간</span></div></div>
 <div class="wl">${MM.sel.map(i=>`<div style="background:#eef7ea;border-color:#c4dcb9">${P[i].e} <b>${esc(P[i].en)}</b><br>${esc(P[i].kr)}</div>`).join('')}</div>
 <div class="row" style="margin-top:14px"><button class="btn" onclick="start('mem')">한 판 더</button><button class="btn w" onclick="home()">처음으로</button></div></div>`;
}
Object.assign(window,{home,start,toggleMute,choose,chooseOX,orderPut,orderBack,orderReset,checkBlank,goNext,retryWrong,cardGo,cardKnow,memFlip,say,save,upScore,SFX,P,DB,$,G:null});
Object.defineProperty(window,'G',{get:()=>G,set:v=>{G=v}});
Object.defineProperty(window,'RANGE',{get:()=>RANGE,set:v=>{RANGE=v}});
home();
}
</script>
</body>
