<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="속담대모험">
<meta name="theme-color" content="#1d5fd6">
<title>조고숭의 속담 대모험 - 조민규영어</title>
<style>
:root{--blue:#1d5fd6;--blue2:#4f8cff;--sky:#e8f1ff;--ink:#1b2440;--sub:#6b7699;--ok:#16a36a;--no:#e5484d;--gold:#ffb81c;--card:#fff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,#cfe0ff 0%,#eef4ff 45%,#fff7e6 100%);background-attachment:fixed;overflow-x:hidden}
body.fever{background:linear-gradient(120deg,#ffd6e7,#fff1b8,#c9f7e4,#cfe0ff,#e9d6ff);background-size:400% 400%;animation:fev 3s linear infinite}
@keyframes fev{0%{background-position:0 50%}100%{background-position:100% 50%}}
#app{max-width:720px;margin:0 auto;min-height:100vh;padding:14px 14px 40px;position:relative}
button{font-family:inherit;cursor:pointer;border:none}
.top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.back{background:#fff;border-radius:12px;width:42px;height:42px;font-size:20px;box-shadow:0 2px 0 #c9d6f2}
.ttl{flex:1;font-weight:900;font-size:16px;color:var(--blue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hud{display:flex;gap:8px;align-items:center;font-weight:800;font-size:14px}
.pill{background:#fff;border-radius:99px;padding:6px 12px;box-shadow:0 2px 0 #c9d6f2;white-space:nowrap}
.hero{display:flex;align-items:center;gap:6px;margin:4px 0 8px}
.hero h1{font-size:27px;line-height:1.15;font-weight:900;color:var(--blue);letter-spacing:-.5px}
.hero h1 small{display:block;font-size:14px;color:var(--sub);font-weight:700;margin-top:6px;letter-spacing:0}
.doll{width:120px;height:140px;flex:none}
.doll.big{width:150px;height:175px}
.hop{animation:hop .5s ease}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-22px) rotate(-6deg)}70%{transform:translateY(0) rotate(4deg)}}
.wob{animation:wob .5s ease}
@keyframes wob{0%,100%{transform:rotate(0)}20%{transform:rotate(-12deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-7deg)}80%{transform:rotate(4deg)}}
.idle{animation:idle 2.4s ease-in-out infinite}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.bubble{position:relative;background:#fff;border-radius:16px;padding:9px 13px;font-weight:800;font-size:14px;box-shadow:0 3px 0 #c9d6f2;max-width:230px}
.bubble:before{content:'';position:absolute;left:-8px;top:18px;border:8px solid transparent;border-right-color:#fff;border-left:0}
.prog{background:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 3px 0 #c9d6f2;margin-bottom:12px}
.bar{height:14px;background:#e3eafc;border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue2),var(--blue));border-radius:99px;transition:width .4s}
.sec{font-weight:900;font-size:15px;margin:16px 2px 8px;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:#fff;border-radius:99px;padding:8px 13px;font-weight:800;font-size:14px;color:var(--sub);box-shadow:0 2px 0 #c9d6f2}
.chip.on{background:var(--blue);color:#fff;box-shadow:0 2px 0 #0f3f99}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{background:#fff;border-radius:18px;padding:14px 12px;text-align:left;box-shadow:0 4px 0 #c9d6f2;transition:transform .1s}
.mode:active{transform:translateY(3px);box-shadow:0 1px 0 #c9d6f2}
.mode b{display:block;font-size:17px;font-weight:900;margin:4px 0 3px}
.mode span{font-size:12.5px;color:var(--sub);font-weight:600;line-height:1.35;display:block}
.mode .ic{font-size:28px}
.mode.boss{grid-column:1/-1;background:linear-gradient(135deg,#2b1d5c,#5b2a86);color:#fff;box-shadow:0 4px 0 #1a103a}
.mode.boss span{color:#d9cbff}
.stage{background:#fff;border-radius:22px;padding:18px 16px;box-shadow:0 5px 0 #c9d6f2;margin-top:8px;position:relative}
.q-kr{font-size:20px;font-weight:900;line-height:1.45;text-align:center}
.q-emo{font-size:46px;text-align:center;margin-bottom:6px}
.q-lbl{text-align:center;font-size:13px;font-weight:800;color:var(--blue);margin-bottom:8px;letter-spacing:.3px}
.q-en{font-size:20px;font-weight:800;text-align:center;line-height:1.5;font-family:Georgia,'Times New Roman',serif}
.opts{display:grid;gap:9px;margin-top:16px}
.opt{background:var(--sky);border-radius:14px;padding:13px 14px;font-size:16.5px;font-weight:700;text-align:left;color:var(--ink);font-family:Georgia,'Times New Roman',serif;box-shadow:0 3px 0 #bccdf0;line-height:1.35}
.opt:active{transform:translateY(2px)}
.opt.ok{background:#d3f5e5;box-shadow:0 3px 0 #7fd8b0}
.opt.no{background:#ffe0e1;box-shadow:0 3px 0 #f2a3a5;animation:shake .4s}
.opt[disabled]{cursor:default}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.ox{display:flex;gap:12px;margin-top:18px}
.ox button{flex:1;font-size:44px;font-weight:900;border-radius:20px;padding:12px 0;background:var(--sky);box-shadow:0 4px 0 #bccdf0}
.ox .o{color:var(--blue)}.ox .x{color:var(--no)}
.timer{height:8px;background:#e3eafc;border-radius:99px;overflow:hidden;margin:-4px 0 14px}
.timer i{display:block;height:100%;background:var(--gold);width:100%}
.slot{min-height:64px;background:#f3f7ff;border:2px dashed #b7c8ef;border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;margin-top:14px}
.pool{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;justify-content:center}
.tile{background:#fff;border-radius:10px;padding:8px 11px;font-size:17px;font-weight:700;font-family:Georgia,serif;box-shadow:0 3px 0 #bccdf0;border:1.5px solid #cfdcf7}
.slot .tile{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 3px 0 #0f3f99}
.slot.bad{border-color:var(--no);animation:shake .4s}
.inp{display:flex;gap:8px;margin-top:16px}
.inp input{flex:1;font-size:19px;padding:12px 14px;border-radius:14px;border:2px solid #b7c8ef;font-family:Georgia,serif;outline:none;min-width:0}
.inp input:focus{border-color:var(--blue)}
.btn{background:var(--blue);color:#fff;font-weight:900;font-size:16px;border-radius:14px;padding:12px 18px;box-shadow:0 4px 0 #0f3f99}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0f3f99}
.btn.sub{background:#fff;color:var(--blue);box-shadow:0 4px 0 #c9d6f2}
.btn.gold{background:var(--gold);color:#4a3300;box-shadow:0 4px 0 #c98a00}
.blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--blue);color:var(--blue)}
.fb{margin-top:14px;border-radius:14px;padding:12px 14px;font-weight:700;font-size:14.5px;line-height:1.55;display:none}
.fb.show{display:block}
.fb.ok{background:#e4f8ef}.fb.no{background:#fff0f0}
.fb .en{font-family:Georgia,serif;font-size:16.5px;font-weight:800;display:block;margin:2px 0}
.fb .hint{color:#5b4a00;background:#fff6d6;border-radius:8px;padding:6px 8px;display:block;margin-top:6px;font-size:13.5px}
.next{display:none;margin-top:12px;width:100%}
.next.show{display:block}
.combo{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-size:34px;font-weight:900;color:var(--blue);text-shadow:0 3px 0 #fff,0 0 18px #fff;pointer-events:none;animation:pop .9s ease forwards;z-index:50;white-space:nowrap}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}
.conf{position:fixed;top:-10px;width:10px;height:14px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.cardx{perspective:900px;margin-top:8px}
.flip{position:relative;height:330px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.flip.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#fff;border-radius:22px;box-shadow:0 5px 0 #c9d6f2;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.face.b{transform:rotateY(180deg);background:#f7faff}
.face .n{position:absolute;top:12px;left:16px;font-weight:900;color:var(--sub);font-size:13px}
.face .st{position:absolute;top:10px;right:14px;font-size:16px}
.face .tap{position:absolute;bottom:12px;font-size:12px;color:var(--sub);font-weight:700}
.row{display:flex;gap:8px;margin-top:12px}
.row>*{flex:1}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.mc{height:104px;border-radius:14px;background:linear-gradient(135deg,var(--blue2),var(--blue));color:#fff;font-size:30px;font-weight:900;box-shadow:0 4px 0 #0f3f99;display:flex;align-items:center;justify-content:center;padding:6px;text-align:center;line-height:1.25}
.mc.open{background:#fff;color:var(--ink);font-size:14px;font-family:Georgia,serif;font-weight:700;box-shadow:0 4px 0 #c9d6f2}
.mc.open.A{border:2px solid #9bbcff}.mc.open.B{border:2px solid #ffcf6b}
.mc.done{background:#d3f5e5;color:#0b6b43;box-shadow:0 4px 0 #7fd8b0;font-size:13px;font-family:Georgia,serif;font-weight:700}
.dex{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.dx{background:#fff;border-radius:14px;padding:10px;text-align:left;box-shadow:0 3px 0 #c9d6f2;font-size:13px;line-height:1.35}
.dx .e{font-size:22px}.dx b{font-family:Georgia,serif;font-size:13.5px;display:block;margin:2px 0}
.dx .s{float:right;font-size:12px}
.dx.lock{opacity:.6}
.res{text-align:center}
.res .big{font-size:44px;font-weight:900;color:var(--blue)}
.wl{text-align:left;margin-top:14px}
.wl div{background:#fff6f6;border-radius:12px;padding:9px 11px;margin-bottom:7px;font-size:13.5px;line-height:1.5}
.wl b{font-family:Georgia,serif;font-size:15px}
.boss{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:6px}
.bossbar{flex:1;height:16px;background:#3b2a66;border-radius:99px;overflow:hidden;border:2px solid #fff}
.bossbar i{display:block;height:100%;background:linear-gradient(90deg,#ff4f8b,#ff9a3d);transition:width .4s}
.ghost{width:86px;height:86px;flex:none}
.ghost.hit{animation:wob .5s}
.lives{font-size:18px;letter-spacing:1px}
.foot{text-align:center;color:var(--sub);font-size:12px;margin-top:22px;font-weight:700}
.name{display:flex;gap:6px;margin-top:8px}
.name input{flex:1;border:2px solid #cfdcf7;border-radius:12px;padding:8px 10px;font-size:15px;font-family:inherit;min-width:0}
.tip{font-size:12.5px;color:var(--sub);font-weight:700;margin-top:6px;line-height:1.5}
.speak{background:#fff;border-radius:12px;padding:6px 10px;font-size:18px;box-shadow:0 2px 0 #c9d6f2;margin-top:8px}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===== 숙명여중2 2학기 기말 속담 학습지: 속담 34 + 관용 표현 12 (클래스카드 학교 세트 기준) ===== */
// [영어, 우리말, 앞부분, 뒷부분, 빈칸 단어, 그림, 외우는 요령, 가짜(오류) 문장]
const RAW=[["Actions speak louder than words.","말보다 행동이 중요하다.","Actions speak","louder than words.","louder","🏃💬","행동(Actions)이 말(words)보다 더 크게(louder) 말한다! 비교급 louder + than","Words speak louder than actions."],["The grass is always greener on the other side.","남의 떡이 더 커 보인다.","The grass is always greener","on the other side.","greener","🌱🏡","저쪽(the other side) 잔디가 늘 더 푸르러(greener) 보인다 — 비교급 greener","The grass is always greener on this side."],["When in Rome, do as the Romans do.","로마에 가면 로마법을 따르라.","When in Rome,","do as the Romans do.","Romans","🏛️🍝","로마에선 로마 사람들(Romans)이 하는 대로(as) 해라","When in Rome, do as the Greeks do."],["The early bird catches the worm.","일찍 일어나는 새가 벌레를 잡는다.","The early bird","catches the worm.","worm","🐦🪱","bird는 단수 → catches (3인칭 단수 -es!)","The early bird catch the worm."],["People who live in glass houses shouldn't throw stones.","가랑잎이 솔잎더러 바스락거린다고 하는 격이다. 똥 묻은 개가 겨 묻은 개 나무란다.","People who live in glass houses","shouldn't throw stones.","stones","🏠🪨","유리집(glass houses)에 사는 사람은 돌(stones)을 던지면 안 된다 — 선행사 People(복수) + who live","People who lives in glass houses shouldn't throw stones."],["A picture is worth a thousand words.","백문이 불여일견","A picture is worth","a thousand words.","worth","🖼️💬","그림 한 장이 천 마디 말(a thousand words)만큼의 가치가 있다(be worth + 명사)","A picture is worth a hundred words."],["Where there's smoke, there's fire.","아니 땐 굴뚝에 연기 나랴.","Where there's smoke,","there's fire.","smoke","💨🔥","연기(smoke)가 있는 곳엔 불(fire)이 있다 — 순서 주의: smoke 먼저!","Where there's fire, there's smoke."],["Practice makes perfect.","연습은 완벽을 만든다.","Practice","makes perfect.","perfect","🎹💯","Practice(단수) → makes. make + 목적어 없이 perfect","Practice make perfect."],["A watched pot never boils.","서둔다고 일이 되는 것은 아니다.","A watched pot","never boils.","boils","🍲👀","지켜봄을 당하는(watched) 냄비는 절대 안 끓는다 — 과거분사 watched가 pot을 꾸밈, pot 단수라 boils","A watching pot never boils."],["Two heads are better than one.","백지장도 맞들면 낫다.","Two heads","are better than one.","heads","🧠🧠","머리 두 개(Two heads)가 하나보다 낫다 — 복수라 are, good의 비교급 better","Two heads are best than one."],["Out of sight, out of mind","눈에서 멀어지면, 마음도 멀어진다.","Out of sight,","out of mind","mind","🙈💭","눈(sight) 밖이면 마음(mind) 밖! out of 두 번 반복","Out of sight, out of heart"],["Honesty is the best policy.","정직이 최선의 방책이다.","Honesty","is the best policy.","policy","😇🏆","정직(Honesty)이 최고의 방책(policy) — 최상급 the best","Honesty is the better policy."],["There is no time like the present.","지금이 가장 좋은 때다.(지금이 적기다.)","There is no time","like the present.","present","⏰🎁","present = 현재, 지금! (선물 아님) 현재 같은 때는 없다","There is no time like the future."],["Two wrongs don't make a right.","악을 악으로 갚아봐야 좋을 게 없다.","Two wrongs","don't make a right.","right","❌❌","잘못 두 개(Two wrongs)를 더해도 옳은 것(a right)이 안 된다","Two rights don't make a wrong."],["A burnt child dreads the fire.","자라 보고 놀란 가슴 솥뚜껑 보고 놀란다.","A burnt child","dreads the fire.","dreads","🧒🔥","불에 덴(burnt) 아이는 불을 두려워한다(dreads) — burn-burnt-burnt, child 단수라 dreads","A burnt child dread the fire."],["Easy come, easy go.","쉽게 얻은 것은 쉽게 잃는다.","Easy come,","easy go.","go","💸🪽","쉽게 오면(come) 쉽게 간다(go) — easy 두 번!","Easy come, hard go."],["Rome wasn't built in a day.","가치 있는 일은 하루아침에 이루어지지 않는다.","Rome wasn't built","in a day.","built","🏛️🧱","로마는 '지어지지' 않았다 → 수동태 wasn't built","Rome didn't build in a day."],["The squeaky wheel gets the grease.","우는 아이 젖 준다.","The squeaky wheel","gets the grease.","grease","🛞🛢️","끼익(squeaky) 소리 내는 바퀴가 기름(grease)을 얻는다 → 우는 아이 젖 준다","The quiet wheel gets the grease."],["The pen is mightier than the sword.","펜은 칼보다 강하다.","The pen","is mightier than the sword.","mightier","🖊️⚔️","mighty → mightier (y를 i로!) 펜이 칼(sword)보다 강하다","The sword is mightier than the pen."],["Birds of a feather flock together.","유유상종. 가재는 게 편이다.","Birds of a feather","flock together.","flock","🐦🪶","같은 깃털(feather)의 새들이 함께 모인다(flock) — Birds 복수라 flock","Birds of a feather flocks together."],["When the going gets tough, the tough get going.","상황이 힘들어지면 강한 사람은 더 강해진다.","When the going gets tough,","the tough get going.","tough","💪🔥","going-tough / tough-going 자리 바꾸기! the tough = 강한 사람들(복수) → get","When the going gets easy, the tough get going."],["What goes around comes around.","뿌린 대로 거둔다.","What goes around","comes around.","comes","🔄🪃","돌아서 나간 것(What goes around)은 돌아온다(comes around) — What절 주어는 단수 → comes","What goes around come around."],["Every cloud has a silver lining.","하늘이 무너져도 솟아날 구멍이 있다.","Every cloud","has a silver lining.","silver","☁️✨","모든 먹구름(cloud) 뒤엔 은빛(silver) 테두리(lining)가 있다 — Every + 단수 → has","Every cloud has a golden lining."],["Don't judge a book by its cover.","겉만 보고 판단하지 마라.","Don't judge a book","by its cover.","cover","📖👀","책을 표지(cover)로 판단하지(judge) 마라 — its(그것의) ≠ it's","Don't judge a book by its title."],["Too many cooks spoil the broth.","사공이 많으면 배가 산으로 간다.","Too many cooks","spoil the broth.","broth","👨‍🍳🍲","요리사(cooks)가 너무 많으면 수프(broth)를 망친다(spoil) — cooks 복수라 spoil","Too many cooks spoils the broth."],["A stitch in time saves nine.","제때 꿰맨 한 땀이 아홉 번의 바느질을 던다.","A stitch in time","saves nine.","nine","🧵🪡","제때(in time) 한 땀(stitch)이 아홉(nine) 땀을 아낀다 — 조고숭이 제일 좋아하는 속담!","A stitch in time saves ten."],["Don't count your chickens before they hatch.","김칫국부터 마셔서는 안 된다.","Don't count your chickens","before they hatch.","hatch","🐣🥚","병아리(chickens)가 부화하기(hatch) 전에 세지 마라","Don't count your eggs before they hatch."],["It never rains but it pours.","설상가상. 비가 내렸다 하면 퍼붓는다.","It never rains","but it pours.","pours","🌧️⛈️","never A but B = A하면 반드시 B → 비가 왔다 하면 퍼붓는다(pours)","It never rains but it snows."],["Don't bite the hand that feeds you.","은혜를 원수로 갚지 마라.","Don't bite the hand","that feeds you.","feeds","🤚🐶","먹여 주는(feeds) 손을 물지(bite) 마라 — 주격 관계대명사 that + 단수 동사 feeds","Don't bite the hand that feed you."],["Beggars can't be choosers.","찬밥 더운밥 가릴 때가 아니다.","Beggars","can't be choosers.","choosers","🍚🙏","거지(Beggars)는 고르는 사람(choosers)이 될 수 없다","Choosers can't be beggars."],["Don't put all of your eggs in one basket.","한 가지 일에 모든 걸 걸지 말아라." /* ===== 공통 게임 화면 ===== */
function topBar(title,extra=''){return `<div class="top"><button class="back" onclick="home()">←</button><div class="ttl">${title}</div><div class="hud">${extra}</div></div>`}
function start(mode,at){
 SFX.tap();speechSynthesis&&speechSynthesis.getVoices();
 const idx=rangeIdx(RANGE);
 if(mode==='card')return cardMode(idx,at);
 if(mode==='mem')return memMode(idx);
 G={mode,queue:shuf(idx),pos:0,score:0,combo:0,maxCombo:0,lives:5,maxLives:5,right:0,tries:0,wrong:{},retry:{},first:{},boss:null};
 if(mode==='boss'){const n=Math.min(Math.max(idx.length,8),20);let q=shuf(idx);while(q.length<n)q=q.concat(shuf(idx));G.queue=q.slice(0,n);G.boss={hp:n,max:n};G.lives=G.maxLives=4}
 nextQ();
}
function hud(){return `<span class="pill">⭐ ${G.score}</span><span class="pill">${G.combo>=5?'🔥':'⚡'} ${G.combo}</span>`}
function nextQ(){
 stopTimer();
 if(G.lives<=0)return result(false);
 if(G.mode==='boss'&&G.boss.hp<=0)return result(true);
 if(G.pos>=G.queue.length)return result(true);
 const i=G.queue[G.pos];const p=P[i];
 let type=G.mode;
 if(type==='quiz')type=Math.random()<.5?'kr2en':'half';
 if(type==='boss')type=pick(['kr2en','half','ox','ox','order','blank']);
 G.cur={i,type,done:false,miss:0};
 const left=G.mode==='boss'?'':`<span class="pill">${G.pos+1}/${G.queue.length}</span>`;
 const bossUI=G.mode==='boss'?`<div class="boss">${ghost(G.boss.hp/G.boss.max)}<div class="bossbar"><i style="width:${G.boss.hp/G.boss.max*100}%"></i></div><b style="font-size:13px;margin-left:4px">${G.boss.hp}/${G.boss.max}</b></div>`:'';
 const head=`${topBar(MODES[G.mode].ic+' '+MODES[G.mode].n,left+hud())}${bossUI}
 <div style="display:flex;align-items:center;gap:8px"><div id="dollbox">${doll('norm',G.lives,G.maxLives,'idle')}</div><div class="bubble" id="bub">${G.combo>=5?pick(LINES.fever):pick(['할 수 있어!','집중~ 집중!','이건 쉽지?','천천히 읽어 봐','시험에 꼭 나온다구!'])}</div></div>`;
 let body='';
 const timed=['kr2en','half','ox'].includes(type);
 if(type==='kr2en'){
  const opts=shuf([i,...shuf(P.map(x=>x.i).filter(x=>x!==i)).slice(0,3)]);G.cur.ans=i;
  body=`<div class="q-lbl">뜻에 맞는 영어 표현은?</div><div class="q-emo">${p.e}</div><div class="q-kr">${esc(p.kr)}</div>
  <div class="opts">${opts.map(o=>`<button class="opt" data-v="${o}" onclick="choose(this,${o})">${esc(P[o].en)}</button>`).join('')}</div>`;
 }else if(type==='half'){
  const opts=shuf([i,...shuf(P.map(x=>x.i).filter(x=>x!==i)).slice(0,3)]);G.cur.ans=i;
  body=`<div class="q-lbl">뒷부분을 이어 붙여라!</div><div class="q-emo">${p.e}</div><div class="q-en">${esc(p.a)} <span class="blank">&nbsp;?&nbsp;</span></div>
  <div class="opts">${opts.map(o=>`<button class="opt" data-v="${o}" onclick="choose(this,${o})">… ${esc(P[o].b)}</button>`).join('')}</div>`;
 }else if(type==='ox'){
  const real=Math.random()<.45;G.cur.ans=real?1:0;G.cur.shown=real?p.en:p.f;
  body=`<div class="q-lbl">진짜 표현일까, 한 단어가 바뀐 가짜일까?</div><div class="q-emo">${p.e}</div><div class="q-en">${esc(G.cur.shown)}</div>
  <div style="text-align:center;color:var(--sub);font-weight:700;font-size:13.5px;margin-top:6px">${esc(p.kr.split('.')[0])}</div>
  <div class="ox"><button class="o" onclick="chooseOX(this,1)">O</button><button class="x" onclick="chooseOX(this,0)">X</button></div>`;
 }else if(type==='order'){
  G.cur.words=p.en.split(' ');G.cur.pool=shuf(G.cur.words.map((w,k)=>({w,k})));
  if(G.cur.pool.map(x=>x.w).join(' ')===p.en&&G.cur.words.length>1)G.cur.pool.reverse();
  G.cur.put=[];
  body=`<div class="q-lbl">단어를 순서대로 눌러 표현을 완성!</div><div class="q-emo">${p.e}</div><div class="q-kr" style="font-size:17px">${esc(p.kr)}</div>
  <div class="slot" id="slot"></div><div class="pool" id="pool"></div>
  <div class="row"><button class="btn sub" onclick="orderReset()">↺ 다시 놓기</button><button class="btn sub" onclick="say(P[G.cur.i].en)">🔊 힌트 듣기 (−50)</button></div>`;
 }else if(type==='blank'){
  const re=new RegExp('\\b'+p.k+'\\b');const html=esc(p.en).replace(re,'<span class="blank">&nbsp;'+'_ '.repeat(Math.min(p.k.length,6))+'</span>');
  G.cur.ans=p.k;
  body=`<div class="q-lbl">빈칸에 들어갈 단어를 쓰세요 (${p.k.length}글자)</div><div class="q-emo">${p.e}</div><div class="q-en">${html}</div>
  <div style="text-align:center;color:var(--sub);font-weight:700;font-size:13.5px;margin-top:6px">${esc(p.kr)}</div>
  <div class="inp"><input id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="정답 입력" onkeydown="if(event.key==='Enter')checkBlank()"><button class="btn" onclick="checkBlank()">확인</button></div>`;
 }
 $('#app').innerHTML=head+`<div class="stage">${timed?'<div class="timer"><i id="tb"></i></div>':''}${body}<div class="fb" id="fb"></div><button class="btn next" id="nx" onclick="G.pos++;nextQ()">다음 ▶</button></div>`;
 if(type==='order')orderDraw();
 if(type==='blank')setTimeout(()=>{const a=$('#ans');a&&a.focus()},50);
 if(timed)startTimer(G.mode==='boss'?12:15);
}
let TM=null;
function startTimer(sec){G.cur.t0=Date.now();G.cur.limit=sec*1000;TM=setInterval(()=>{const r=1-(Date.now()-G.cur.t0)/G.cur.limit;const b=$('#tb');if(b){b.style.width=Math.max(0,r*100)+'%';b.style.background=r<.3?'#e5484d':'#ffb81c'}if(r<=0){stopTimer();timeUp()}},100)}
function stopTimer(){if(TM){clearInterval(TM);TM=null}}
function remain(){if(!G.cur.t0)return 0;return Math.max(0,Math.round((G.cur.limit-(Date.now()-G.cur.t0))/1000))}
function timeUp(){if(G.cur.done)return;document.querySelectorAll('.opt,.ox button').forEach(b=>b.disabled=true);fail('시간 초과! ⏰')}
/* 정답 / 오답 처리 */
function good(extra=0){
 const c=G.cur;c.done=true;stopTimer();
 const firstTry=c.miss===0;
 G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);G.right++;
 let pt=100+Math.min(G.combo,10)*10+remain()*5+extra;
 if(G.combo>=5)pt*=2;
 G.score+=Math.round(pt);
 if(firstTry&&!G.first[c.i]){addStar(c.i,1);G.first[c.i]=1}
 if(G.combo===5){SFX.fever();document.body.classList.add('fever');floatTxt('🔥 FEVER x2 🔥','#ff4f8b')}
 else{SFX.ok();floatTxt(G.combo>=2?`${G.combo} COMBO! +${Math.round(pt)}`:`+${Math.round(pt)}`)}
 if(G.mode==='boss'){G.boss.hp=Math.max(0,G.boss.hp-(G.combo>=5?2:1));SFX.hit();const gh=document.querySelector('.ghost');if(gh){gh.outerHTML=ghost(G.boss.hp/G.boss.max).replace('class="ghost"','class="ghost hit"')}const bb=document.querySelector('.bossbar i');if(bb)bb.style.width=(G.boss.hp/G.boss.max*100)+'%'}
 react('happy',G.combo>=5?pick(LINES.fever):pick(LINES.ok));
 say(P[c.i].en);
 showFB(true);
 refreshHud();
}
function fail(msg){
 const c=G.cur;c.done=true;stopTimer();
 G.combo=0;document.body.classList.remove('fever');G.lives--;
 G.wrong[c.i]=(G.wrong[c.i]||0)+1;
 if(!G.first[c.i]){addStar(c.i,-1);G.first[c.i]=1}
 if(!G.retry[c.i]&&G.mode!=='boss'){G.retry[c.i]=1;G.queue.splice(Math.min(G.pos+4,G.queue.length),0,c.i)}
 SFX.no();react('sad',msg||pick(LINES.no));
 if(G.mode==='boss')floatTxt('까먹깨비의 공격! 💥','#8b5cf6');
 showFB(false);refreshHud();
}
function refreshHud(){const h=document.querySelector('.hud');if(h){const l=G.mode==='boss'?'':`<span class="pill">${G.pos+1}/${G.queue.length}</span>`;h.innerHTML=l+hud()}}
function showFB(ok){
 const p=P[G.cur.i];const fb=$('#fb');
 fb.className='fb show '+(ok?'ok':'no');
 fb.innerHTML=`${ok?'⭕ 정답!':'❌ 정답은'} <span class="en">${esc(p.en)}</span>${esc(p.kr)}<span class="hint">💡 ${esc(p.h)}</span>
 <button class="speak" onclick="say(P[${p.i}].en)">🔊 발음 듣기</button>`;
 $('#nx').classList.add('show');
 if(G.lives<=0)$('#nx').textContent='결과 보기 ▶';
}
function choose(btn,v){
 if(G.cur.done)return;
 document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(+b.dataset.v===G.cur.ans)b.classList.add('ok')});
 if(v===G.cur.ans){good()}else{btn.classList.add('no');fail()}
}
function chooseOX(btn,v){
 if(G.cur.done)return;
 document.querySelectorAll('.ox button').forEach(b=>b.disabled=true);
 if(v===G.cur.ans){good();if(!G.cur.ans){$('#fb').insertAdjacentHTML('afterbegin',`<div style="margin-bottom:6px">가짜 문장: <s>${esc(G.cur.shown)}</s></div>`)}}
 else{fail(G.cur.ans?'진짜 속담이었어!':'가짜였어! 한 단어가 달라');if(!G.cur.ans)$('#fb').insertAdjacentHTML('afterbegin',`<div style="margin-bottom:6px">가짜 문장: <s>${esc(G.cur.shown)}</s></div>`)}
}
/* 문장 조립 */
function orderDraw(){
 const c=G.cur;
 $('#slot').innerHTML=c.put.map((t,k)=>`<button class="tile" onclick="orderBack(${k})">${esc(t.w)}</button>`).join('')||'<span style="color:#9fb0d6;font-weight:700;font-size:14px;padding:8px">여기에 단어가 들어가요</span>';
 $('#pool').innerHTML=c.pool.map((t,k)=>`<button class="tile" onclick="orderPut(${k})">${esc(t.w)}</button>`).join('');
}
function orderPut(k){if(G.cur.done)return;SFX.tap();const c=G.cur;c.put.push(c.pool.splice(k,1)[0]);orderDraw();if(!c.pool.length)orderCheck()}
function orderBack(k){if(G.cur.done)return;const c=G.cur;c.pool.push(c.put.splice(k,1)[0]);orderDraw()}
function orderReset(){if(G.cur.done)return;const c=G.cur;c.pool=c.pool.concat(c.put);c.put=[];orderDraw()}
function orderCheck(){
 const c=G.cur;const s=c.put.map(t=>t.w).join(' ');
 if(s===P[c.i].en){good(50);return}
 c.miss++;
 if(c.miss===1){const sl=$('#slot');sl.classList.add('bad');SFX.no();G.combo=0;document.body.classList.remove('fever');refreshHud();
  let k=0;while(k<c.put.length&&c.put[k].w===c.words[k])k++;
  react('sad',`앞에서 ${k}단어까지는 맞았어! 다시 해 보자`);
  setTimeout(()=>{sl.classList.remove('bad');const keep=c.put.slice(0,k);c.pool=shuf(c.pool.concat(c.put.slice(k)));c.put=keep;orderDraw()},700);
 }else{fail()}
}
/* 빈칸 */
const norm=s=>s.toLowerCase().replace(/[^a-z']/g,'');
function checkBlank(){
 if(G.cur.done)return;const a=$('#ans');const v=norm(a.value);if(!v)return;
 if(v===norm(G.cur.ans)){a.style.borderColor='var(--ok)';good(40);return}
 G.cur.miss++;
 if(G.cur.miss===1){SFX.no();G.combo=0;document.body.classList.remove('fever');refreshHud();const k=G.cur.ans;a.value='';a.placeholder=`힌트: ${k[0]}${'_'.repeat(k.length-2)}${k.length>1?k[k.length-1]:''}`;a.classList.add('bad');a.style.borderColor='var(--no)';react('sad','첫 글자랑 끝 글자 힌트 줄게!');a.focus()}
 else{a.disabled=true;fail()}
}
/* ===== 결과 ===== */
function result(clear){
 stopTimer();document.body.classList.remove('fever');
 const key=G.mode+RANGE;const isBest=G.score>(DB.best[key]||0);if(isBest)DB.best[key]=G.score;DB.plays++;save();
 const boss=G.mode==='boss';const win=boss?G.boss.hp<=0:clear&&G.lives>0;
 if(win){SFX.win();confetti()}
 const wl=Object.keys(G.wrong).map(Number);
 const title=boss?(win?'까먹깨비를 물리쳤다!':'까먹깨비에게 졌다…'):(G.lives<=0?'바나나를 다 뺏겼어요!':'스테이지 클리어!');
 $('#app').innerHTML=`${topBar('결과')}
 <div class="stage res"><div id="dollbox" style="display:flex;justify-content:center">${doll(win?'happy':'sad',Math.max(G.lives,0),G.maxLives,win?'hop big':'wob big')}</div>
 <div style="font-size:22px;font-weight:900;margin:6px 0">${title}</div>
 <div class="big">${G.score}점</div>${isBest&&G.score?'<div style="color:#e08a00;font-weight:900">🏆 최고 기록!</div>':''}
 <div style="color:var(--sub);font-weight:800;margin-top:6px">맞힌 문제 ${G.right} · 최대 콤보 ${G.maxCombo} · 남은 바나나 ${Math.max(G.lives,0)}</div>
 ${wl.length?`<div class="wl"><div style="background:none;padding:0;font-weight:900">다시 볼 속담 ${wl.length}개</div>${wl.map(i=>`<div>${P[i].e} <b>${esc(P[i].en)}</b><br>${esc(P[i].kr)}<br><span style="color:#7a5a00">💡 ${esc(P[i].h)}</span></div>`).join('')}</div>`:'<div style="margin-top:12px;font-weight:900;color:var(--ok)">하나도 안 틀렸어요! 완벽! 🎉</div>'}
 <div class="row" style="margin-top:16px"><button class="btn" onclick="start('${G.mode}')">한 번 더</button><button class="btn sub" onclick="home()">처음으로</button></div>
 ${wl.length?`<button class="btn gold" style="width:100%;margin-top:10px" onclick="retryWrong([${wl}])">틀린 것만 다시 (${wl.length}개)</button>`:''}
 </div>`;
}
function retryWrong(list){const m=G.mode==='boss'?'quiz':G.mode;G={mode:m,queue:shuf(list),pos:0,score:0,combo:0,maxCombo:0,lives:5,maxLives:5,right:0,wrong:{},retry:{},first:{}};nextQ()}
/* ===== 카드 ===== */
let CD={};
function cardMode(idx,at){CD={list:idx,k:at!=null?Math.max(0,idx.indexOf(at)):0};cardDraw()}
function cardDraw(){
 const p=P[CD.list[CD.k]];
 $('#app').innerHTML=`${topBar('📖 카드 외우기',`<span class="pill">${CD.k+1}/${CD.list.length}</span>`)}
 <div class="cardx"><div class="flip" id="fl" onclick="this.classList.toggle('on');if(this.classList.contains('on'))say(P[${p.i}].en)">
 <div class="face"><span class="n">${p.no}</span><span class="st">${stars(star(p.i))}</span><div style="font-size:64px">${p.e}</div><div class="q-kr" style="margin-top:12px">${esc(p.kr)}</div><div style="margin-top:14px;font-family:Georgia,serif;font-size:18px;font-weight:700;color:var(--blue)">${esc(p.a)} …</div><span class="tap">눌러서 뒤집기</span></div>
 <div class="face b"><span class="n">${p.no}</span><div style="font-size:40px">${p.e}</div><div class="q-en" style="font-size:22px;margin-top:8px">${esc(p.en)}</div><div style="margin-top:8px;font-weight:700;color:var(--sub);font-size:14px">${esc(p.kr)}</div><div class="fb show" style="background:#fff6d6;color:#5b4a00;text-align:left">💡 ${esc(p.h)}</div><span class="tap">다시 눌러 앞면</span></div>
 </div></div>
 <div class="row"><button class="btn sub" onclick="cardGo(-1)">◀ 이전</button><button class="btn sub" onclick="say(P[${p.i}].en)">🔊 듣기</button><button class="btn sub" onclick="cardGo(1)">다음 ▶</button></div>
 <div class="row"><button class="btn" style="background:#ff8a3d;box-shadow:0 4px 0 #c45f17" onclick="cardGo(1)">😵 아직 몰라요</button><button class="btn" onclick="addStar(${p.i},1);SFX.ok();floatTxt('★ +1');setTimeout(()=>cardGo(1),300)">😎 외웠어요 ★+1</button></div>
 <div style="display:flex;align-items:center;gap:8px;margin-top:12px"><div id="dollbox">${doll('happy',5,5,'idle')}</div><div class="bubble">${pick(['앞면 보고 영어로 먼저 말해 봐! 그다음 뒤집기!','소리 내서 세 번 따라 읽으면 오래 가!','💡 요령까지 읽으면 시험 함정도 피할 수 있어!'])}</div></div>`;
 let sx=null;const fl=$('#fl');fl.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});fl.addEventListener('touchend',e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>60){e.preventDefault();cardGo(dx<0?1:-1)}sx=null});
}
function cardGo(d){SFX.tap();CD.k=(CD.k+d+CD.list.length)%CD.list.length;cardDraw()}
/* ===== 반쪽 짝맞추기 ===== */
let MM={};
function memMode(idx){
 const sel=shuf(idx).slice(0,6);
 MM={sel,cards:shuf(sel.flatMap(i=>[{i,s:'A'},{i,s:'B'}])),open:[],done:{},moves:0,t0:Date.now(),lock:false,combo:0,score:0};
 memDraw();
}
function memDraw(){
 const left=MM.sel.length-Object.keys(MM.done).length;
 $('#app').innerHTML=`${topBar('🃏 반쪽 짝맞추기',`<span class="pill">남은 짝 ${left}</span><span class="pill">🔄 ${MM.moves}</span>`)}
 <div style="display:flex;align-items:center;gap:8px"><div id="dollbox">${doll('norm',5,5,'idle')}</div><div class="bubble" id="bub">파란 테두리 = 앞부분, 노란 테두리 = 뒷부분! 짝을 찾아 줘</div></div>
 <div class="mem">${MM.cards.map((c,k)=>{const p=P[c.i];const isDone=MM.done[c.i];const isOpen=MM.open.includes(k);
  if(isDone)return `<div class="mc done">${esc(c.s==='A'?p.a:p.b)}</div>`;
  if(isOpen)return `<div class="mc open ${c.s}">${esc(c.s==='A'?p.a+' …':'… '+p.b)}</div>`;
  return `<button class="mc" onclick="memFlip(${k})">${c.s==='A'?'🧵':'🪡'}</button>`}).join('')}</div>`;
}
function memFlip(k){
 if(MM.lock||MM.open.includes(k))return;SFX.tap();MM.open.push(k);memDraw();
 if(MM.open.length<2)return;
 MM.moves++;MM.lock=true;const [a,b]=MM.open.map(x=>MM.cards[x]);
 if(a.i===b.i&&a.s!==b.s){
  MM.combo++;MM.score+=100+MM.combo*30;
  setTimeout(()=>{MM.done[a.i]=1;MM.open=[];MM.lock=false;SFX.ok();say(P[a.i].en);memDraw();react2('happy',`${P[a.i].e} ${MM.combo>=2?MM.combo+'연속 성공!':'짝 찾았다!'}`);floatTxt(MM.combo>=2?`${MM.combo} COMBO!`:'짝!');
   if(Object.keys(MM.done).length===MM.sel.length)setTimeout(memEnd,900)},450);
 }else{
  MM.combo=0;
  setTimeout(()=>{MM.open=[];MM.lock=false;SFX.no();memDraw();react2('sad',pick(['아깝다! 위치 기억해 둬','음… 그 짝이 아니야','다시 찾아보자!']))},950);
 }
}
function react2(m,t){const d=$('#dollbox');if(d)d.innerHTML=doll(m,5,5,m==='happy'?'hop':'wob');const b=$('#bub');if(b)b.textContent=t}
function memEnd(){
 const sec=Math.round((Date.now()-MM.t0)/1000);const score=Math.max(100,MM.score+600-MM.moves*15-sec*3);
 const key='mem'+RANGE;const best=score>(DB.best[key]||0);if(best)DB.best[key]=score;save();SFX.win();confetti();
 $('#app').innerHTML=`${topBar('결과')}<div class="stage res"><div style="display:flex;justify-content:center">${doll('happy',5,5,'hop big')}</div>
 <div style="font-size:22px;font-weight:900">짝 6개 모두 찾았다!</div><div class="big">${score}점</div>${best?'<div style="color:#e08a00;font-weight:900">🏆 최고 기록!</div>':''}
 <div style="color:var(--sub);font-weight:800;margin-top:6px">${MM.moves}번 뒤집기 · ${sec}초</div>
 <div class="wl">${MM.sel.map(i=>`<div style="background:#eef6ff">${P[i].e} <b>${esc(P[i].en)}</b><br>${esc(P[i].kr)}</div>`).join('')}</div>
 <div class="row" style="margin-top:14px"><button class="btn" onclick="start('mem')">한 판 더</button><button class="btn sub" onclick="home()">처음으로</button></div></div>`;
}
home();
</script>
</body>
</html>
