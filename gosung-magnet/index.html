<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>조고숭의 자기장 탈출</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12141b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: 박진감 있는 오락실 배틀, 그러나 과학 내용은 정확하게
   IDEA: 자석 실험실 행성 — 빨강 N, 파랑 S가 세상의 전부인 곳
   PICTURE: 조고숭(실제 인형 사진)과 마그몬이 맞붙는 배틀 화면, 실험 장치 SVG
   COLOUR and TYPE: 깊은 실험실 어둠 #12141b, N 빨강 #ef4b42, S 파랑 #3479ee, 불꽃 노랑 #ffd23a / Jua 제목 + Noto Sans KR 본문
   LAYOUT: 한 화면 한 장면 — 맵 → 대화 → 실험 → 배틀 → 결과 */
:root{color-scheme:dark;--bg:#12141b;--panel:#1d2130;--panel2:#262b3d;--ink:#f3f4f8;--mute:#a9afc4;--n:#ef4b42;--s:#3479ee;--y:#ffd23a;--g:#3ddc84;--line:#343a50}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip}
body{background:radial-gradient(1200px 600px at 80% -10%,#24305a55,transparent 60%),radial-gradient(900px 500px at -10% 110%,#5a242455,transparent 60%),var(--bg);min-height:100vh}
h1,h2,h3,.jua{font-family:Jua,"Noto Sans KR",sans-serif;font-weight:400;letter-spacing:.2px}
.wrap{max-width:900px;margin:0 auto;padding:16px max(4vw,14px) 40px}
button{font:inherit;color:inherit;cursor:pointer;border:0;min-height:44px;border-radius:14px}
button:focus-visible,input:focus-visible{outline:3px solid var(--y);outline-offset:2px}
.btn{background:var(--y);color:#1a1400;font-weight:900;padding:10px 20px;box-shadow:0 4px 0 #b08d10}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b08d10}
.btn2{background:var(--panel2);border:1px solid var(--line);padding:10px 16px;font-weight:700}
.btn2.on{background:#2c3a62;border-color:var(--s)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ava{width:64px;height:64px;border-radius:50%;object-fit:cover;border:3px solid var(--y);flex:none;background:#5b3a22}
.ava.big{width:min(46vw,220px);height:min(46vw,220px);border-width:5px}
/* title */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center;padding:20px 0 8px}
.hero h1{font-size:clamp(34px,7vw,52px);line-height:1.05;margin:0 0 8px;text-wrap:balance}
.hero h1 b{color:var(--y);font-weight:400}
.hero p{margin:0;color:var(--mute)}
@media(max-width:600px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center}}
/* map */
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:22px}
.st{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 16px;text-align:left;display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:center;min-height:84px}
.st .num{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font:28px Jua,sans-serif;background:linear-gradient(135deg,var(--n) 50%,var(--s) 50%)}
.st h3{margin:0;font-size:19px;line-height:1.2}
.st small{color:var(--mute);font-size:13px}
.st .stars{color:var(--y);font-size:15px;letter-spacing:2px}
.st[disabled]{opacity:.45;cursor:not-allowed}
.st.boss{grid-column:1/-1;background:linear-gradient(90deg,#3a1720,#1d2130 50%,#17244a)}
.st.boss .num{background:#000;color:var(--y)}
.tiny{font-size:13px;color:var(--mute)}
.link{background:none;color:var(--mute);text-decoration:underline;min-height:32px;padding:4px}
/* talk */
.talk{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:end;margin-top:16px}
.bub{background:#fff;color:#161820;border-radius:20px 20px 20px 4px;padding:18px 20px;font-size:18px;line-height:1.6;min-height:120px;position:relative}
.bub b{color:#c22d24}.bub i{font-style:normal;color:#1f5bd0;font-weight:700}
.bub .who{font:15px Jua,sans-serif;color:#8a5a2b;display:block;margin-bottom:4px}
.dots{display:flex;gap:6px;margin:12px 0}.dots span{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots span.on{background:var(--y)}
@media(max-width:600px){.talk{grid-template-columns:1fr}.talk .ava{width:72px;height:72px}}
/* sim */
.lab{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px;margin-top:14px}
.lab svg{width:100%;height:auto;display:block;background:#0e1016;border-radius:14px}
.say{display:flex;gap:10px;align-items:center;background:#0e1016;border-radius:14px;padding:10px 12px;margin-top:10px;font-weight:700;min-height:56px}
.say img{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:none}
.ctrl{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:12px}
.ctrl label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--mute);background:var(--panel2);padding:8px 12px;border-radius:12px}
input[type=range]{width:100%;accent-color:var(--y);height:28px}
.meter{height:16px;background:#0e1016;border-radius:9px;overflow:hidden}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--s),var(--n));transition:width .3s}
svg text{font-family:"Noto Sans KR",sans-serif;font-weight:900}
.mv{transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
/* battle */
.arena{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;margin-top:12px}
.fighter{text-align:center}
.fighter .nm{font:18px Jua,sans-serif;margin-top:4px}
.vs{font:34px Jua,sans-serif;color:var(--y)}
.hp{height:14px;background:#0e1016;border-radius:8px;overflow:hidden;margin:6px auto 0;max-width:200px;border:1px solid var(--line)}.hp i{display:block;height:100%;background:var(--g);transition:width .4s}
.hearts{font-size:22px;color:var(--n);letter-spacing:2px;min-height:30px}
.mon{width:min(36vw,170px);height:auto}
.shake{animation:sh .45s}@keyframes sh{20%{transform:translateX(-10px) rotate(-4deg)}40%{transform:translateX(10px) rotate(4deg)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.hit{animation:hit .5s}@keyframes hit{30%{filter:brightness(3) saturate(0);transform:scale(.9)}}
.hud{display:flex;justify-content:space-between;gap:8px;font:18px Jua,sans-serif;margin-top:10px}
.hud .combo{color:var(--y)}
.timer{height:10px;background:#0e1016;border-radius:6px;overflow:hidden;margin-top:6px}.timer i{display:block;height:100%;background:var(--y)}
.qcard{background:#fff;color:#161820;border-radius:20px;padding:18px;margin-top:12px}
.qcard .qn{font:15px Jua,sans-serif;color:#8a5a2b}
.qcard h2{font:700 19px/1.5 "Noto Sans KR",sans-serif;margin:4px 0 12px}
.ch{display:grid;gap:8px}
.ch button{background:#eef0f6;color:#161820;text-align:left;padding:12px 14px;font-weight:700;border:2px solid transparent;font-size:16px}
.ch button:hover{border-color:#c9cee0}
.ch button.ok{background:#d6f7e4;border-color:#22a35a}.ch button.no{background:#fde0de;border-color:#d23a30}
.exp{margin-top:12px;background:#fff7d6;border-radius:14px;padding:12px 14px;color:#3a2f00;font-size:15.5px}
.exp b{color:#b42318}
.float{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font:clamp(36px,9vw,64px) Jua,sans-serif;color:var(--y);text-shadow:0 4px 0 #000;pointer-events:none;animation:fl 1s forwards;z-index:9;white-space:nowrap}
.float.bad{color:var(--n)}
@keyframes fl{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}
.result{text-align:center;padding-top:20px}
.result .big{font:clamp(40px,10vw,64px)/1.05 Jua,sans-serif;margin:10px 0}
.result .stars{font-size:46px;color:var(--y);letter-spacing:6px}
.rv{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px;text-align:left;font-size:15px}
.rv b{color:var(--y)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top h2{margin:0;font-size:24px;line-height:1.2}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
{
const IMG='gosung.jpg';
const $=s=>document.querySelector(s);
const app=$('#app');
let anim=0, tmr=0, AC=null;
function beep(f=600,d=.12,t='square',v=.06){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
const sGood=()=>{beep(660,.08);setTimeout(()=>beep(990,.15),80)};
const sBad=()=>{beep(180,.3,'sawtooth',.07)};
function load(){try{return JSON.parse(localStorage.getItem('gosung-mag')||'{}')}catch(e){return{}}}
function save(d){try{localStorage.setItem('gosung-mag',JSON.stringify(d))}catch(e){}}
let SAVE=load(); SAVE.stars=SAVE.stars||{}; SAVE.best=SAVE.best||{};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function floatTxt(t,bad){const d=document.createElement('div');d.className='float'+(bad?' bad':'');d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1000)}
function stopAll(){cancelAnimationFrame(anim);clearInterval(tmr);if(window._osc){try{window._osc.stop()}catch(e){}window._osc=null}}

/* ---------- 몬스터 ---------- */
function mon(c1,c2,big){return `<svg class="mon" viewBox="0 0 200 200" aria-label="몬스터">
<ellipse cx="100" cy="186" rx="62" ry="9" fill="#000" opacity=".4"/>
<path d="M58 70 L40 18 L80 52Z" fill="${c1}"/><path d="M142 70 L160 18 L120 52Z" fill="${c2}"/>
<text x="50" y="45" fill="#fff" font-size="16">N</text><text x="142" y="45" fill="#fff" font-size="16">S</text>
<path d="M30 120 Q30 52 100 52 Q170 52 170 120 Q170 182 100 182 Q30 182 30 120Z" fill="url(#mg${c1.slice(1)})"/>
<defs><linearGradient id="mg${c1.slice(1)}" x1="0" x2="1"><stop offset=".5" stop-color="${c1}"/><stop offset=".5" stop-color="${c2}"/></linearGradient></defs>
<path d="M45 96 Q60 72 100 70 Q80 80 60 104Z" fill="#fff" opacity=".25"/>
<ellipse cx="76" cy="112" rx="15" ry="${big?11:15}" fill="#fff"/><ellipse cx="124" cy="112" rx="15" ry="${big?11:15}" fill="#fff"/>
<circle cx="79" cy="115" r="7" fill="#111"/><circle cx="121" cy="115" r="7" fill="#111"/>
<path d="M60 92 L92 102M140 92 L108 102" stroke="#111" stroke-width="6" stroke-linecap="round"/>
<path d="M74 150 Q100 ${big?132:140} 126 150" stroke="#111" stroke-width="6" fill="none" stroke-linecap="round"/>
<path d="M84 147 l5 9 l5-9M108 147 l5 9 l5-9" fill="#fff"/>
</svg>`}

/* ---------- 스테이지 데이터 ---------- */
const STAGES=[
{t:'자석의 숲',sub:'자기력 · 자기장 · 자기력선',mon:['#ef4b42','#3479ee'],mn:'마그몬',sim:'magnets',
talk:['안녕! 나는 <b>조고숭</b>이야. 자기장 행성에 갇혀 버렸어… 6개의 관문을 깨고 나를 탈출시켜 줘!',
'첫 관문! 자석과 자석 사이에 작용하는 힘을 <b>자기력</b>이라고 해. <b>다른 극</b>은 끌어당기고(인력), <i>같은 극</i>은 밀어내(척력).',
'자기력이 작용하는 공간이 <b>자기장</b>이야. 방향은 <b>나침반 바늘의 N극이 가리키는 방향</b>! 극에 가까울수록 세.',
'<b>자기력선</b> 3가지 규칙만 외우자! ① N극에서 나와 S극으로 들어간다 ② 끊어지거나 <b>교차하지 않는다</b> ③ 촘촘할수록 자기장이 세다.'],
q:[
{q:'서로 다른 극(N극과 S극)을 가까이 하면 어떤 힘이 작용할까?',c:['서로 끌어당기는 힘(인력)','서로 밀어내는 힘(척력)','아무 힘도 작용하지 않는다','번갈아 밀고 당긴다'],a:0,e:'다른 극끼리는 <b>끌어당기는 힘(인력)</b>, 같은 극끼리는 밀어내는 힘(척력)!'},
{q:'자기장의 방향은 어떻게 정할까?',c:['나침반 바늘의 N극이 가리키는 방향','나침반 바늘의 S극이 가리키는 방향','전류가 흐르는 방향','항상 지구의 북쪽'],a:0,e:'자기장의 방향 = <b>나침반 바늘 N극이 가리키는 방향</b>.'},
{q:'자기력선에 대한 설명으로 옳지 않은 것은?',c:['서로 교차할 수 있다','N극에서 나와 S극으로 들어간다','중간에 끊어지지 않는다','간격이 촘촘할수록 자기장이 세다'],a:0,e:'자기력선은 <b>절대 교차하지 않는다</b>. 끊어지지도 않아!'},
{q:'막대자석 주위에서 자기장이 가장 센 곳은?',c:['양 끝(극) 부분','자석의 한가운데','자석에서 아주 먼 곳','어디나 똑같다'],a:0,e:'양 극에 가까울수록 자기력선이 촘촘 → <b>양 끝에서 가장 세다</b>.'},
{q:'지구의 지리상 북극 근처에는 자석의 어떤 극이 있을까?',c:['S극','N극','극이 없다','N극과 S극이 섞여 있다'],a:0,e:'나침반 N극이 북쪽으로 끌려가니까, 북극 근처에는 N극을 끌어당기는 <b>S극</b>이 있어!'},
{q:'두 막대자석의 N극과 N극을 마주 보게 했을 때 옳은 것은?',c:['자기력선이 각각의 N극에서 나오고, 서로 밀어낸다','자기력선이 한쪽 N극에서 다른 N극으로 이어진다','자기력선이 서로 교차한다','서로 끌어당긴다'],a:0,e:'같은 극끼리는 자기력선이 이어지지 않고 <b>각각 N극에서 나와 휘어 나가며 밀어낸다</b>.'}]},
{t:'코일 동굴',sub:'전류가 흐르는 코일 주위의 자기장',mon:['#ff8a3d','#3479ee'],mn:'코일몬',sim:'coil',
talk:['두 번째 관문! 코일에 전류가 흐르면 코일 주위에 <b>자기장</b>이 생겨. 코일이 자석처럼 변하는 거지!',
'<b>오른손 법칙</b>: 오른손 네 손가락으로 <b>전류 방향</b>을 따라 감아쥐면, <b>엄지</b>가 가리키는 쪽이 코일 내부의 자기장 방향 = <b>N극</b>!',
'코일 <b>내부</b> 자기장은 <i>직선</i> 모양, <b>외부</b>는 <i>막대자석</i> 주위와 비슷한 모양이야. 그래서 코일 <b>안과 바로 위·아래</b>는 나침반이 <b>반대</b> 방향을 가리켜!',
'전류 방향이 바뀌면 자기장 방향도 바뀌어. 전류가 셀수록, 코일을 촘촘히 감을수록 자기장이 세져.'],
q:[
{q:'오른손 네 손가락을 전류 방향으로 감아쥘 때, 엄지손가락이 가리키는 것은?',c:['코일 내부의 자기장 방향(N극 쪽)','전류가 흐르는 방향','코일 내부의 S극 쪽','코일이 받는 힘의 방향'],a:0,e:'엄지 = <b>코일 내부 자기장 방향</b> = 나침반 N극이 가리키는 방향 = 코일의 N극 쪽.'},
{q:'전류가 흐르는 코일 내부의 자기장 모양은?',c:['직선 모양','동심원 모양','막대자석 주위와 비슷한 모양','소용돌이 모양'],a:0,e:'코일 <b>내부는 직선</b>, 외부는 막대자석 주위와 비슷한 모양!'},
{q:'코일 내부에 놓인 나침반 N극이 동쪽을 가리킨다. 코일 바로 위에 놓인 나침반 N극은?',c:['서쪽','동쪽','북쪽','남쪽'],a:0,e:'자기력선은 내부에서 한 방향, 외부에서 돌아오니까 <b>코일 안과 바로 위·아래는 반대 방향</b> → 서쪽!'},
{q:'코일에 흐르는 전류의 방향을 반대로 바꾸면?',c:['나침반 N극이 가리키는 방향이 반대로 바뀐다','나침반이 움직이지 않는다','자기장이 사라진다','자기장이 더 세진다'],a:0,e:'전류 방향이 바뀌면 <b>자기장 방향이 바뀌어</b> 나침반도 반대로!'},
{q:'코일 주위 자기장을 세게 만드는 방법이 아닌 것은?',c:['코일을 듬성듬성 감는다','전류를 세게 흐르게 한다','코일을 촘촘히 감는다','코일 속에 철심을 넣는다'],a:0,e:'세게 하려면 전류↑, <b>코일을 촘촘히</b>, 철심 넣기! 듬성듬성은 반대.'},
{q:'직선 도선 주위에 생기는 자기장의 모양은?',c:['도선을 중심으로 한 동심원 모양','도선과 나란한 직선 모양','막대자석과 같은 모양','자기장이 생기지 않는다'],a:0,e:'직선 도선 → <b>동심원</b>. 도선 위와 아래에서는 자기장 방향이 반대야.'}]},

{t:'밀당 계곡',sub:'자기장 속에서 코일이 받는 힘',mon:['#3479ee','#ef4b42'],mn:'밀당몬',sim:'force',

{t:'전동기 엔진실',sub:'코일이 받는 힘으로 돌아가는 전동기',mon:['#3ddc84','#3479ee'],mn:'모터몬',sim:'motor',

const setTxt=()=>{q('#msay').innerHTML=say(comm?`정류자가 반 바퀴마다 전류 방향을 바꿔서 코일의 N·S가 바뀌어. 그래서 <b style="color:var(--y)">${dir>0?'시계 방향':'반시계 방향'}</b>으로 계속 돌아!`:'정류자를 뺐더니… 코일 N극이 자석 S극 쪽에 끌려가서 <b style="color:var(--n)">멈춰 버렸어!</b>')};
q('#cm').onclick=e=>{comm=!comm;e.target.textContent=comm?'정류자 있음':'정류자 뺌';e.target.classList.toggle('on',comm);if(comm&&Math.abs(w)<.5)w=dir*2;beep(500,.06);setTxt()};
q('#dr').onclick=()=>{dir=-dir;if(!comm){flip=!flip}beep(420,.06);setTxt()};
q('#pw').oninput=e=>{pow=+e.target.value};
setTxt();
const tick=t=>{const dt=Math.min(.05,(t-(last||t))/1000);last=t;
if(comm){const target=dir*pow*120;w+=(target-w)*Math.min(1,dt*3);const before=Math.floor(ang/180);ang+=w*dt;if(Math.floor(ang/180)!==before){flip=!flip;flash=1;beep(880,.03,'square',.03)}}
else{const nEnd=flip?ang+180:ang;const th=(((nEnd%360)+540)%360-180)*Math.PI/180;const tq=-pow*600*Math.sin(th);w+=(tq-w*2.2)*dt;ang+=w*dt}
flash=Math.max(0,flash-dt*1.5);
q('#rot').setAttribute('transform',`rotate(${ang} 300 150)`);
const a=flip?'S':'N',b=flip?'N':'S';q('#tA').textContent=a;q('#tB').textContent=b;
q('#eA').setAttribute('fill',a==='N'?'#ef4b42':'#3479ee');q('#eB').setAttribute('fill',b==='N'?'#ef4b42':'#3479ee');
q('#tA').setAttribute('transform',`rotate(${-ang} 222 150)`);q('#tB').setAttribute('transform',`rotate(${-ang} 378 150)`);
q('#fl').setAttribute('opacity',comm?flash:0);
anim=requestAnimationFrame(tick)};anim=requestAnimationFrame(tick)},

speaker(el){let mode='stop',off=0,last=0,ph=0;
el.innerHTML=`<svg viewBox="0 0 600 280">
<rect x="60" y="100" width="70" height="80" fill="#ef4b42"/><rect x="130" y="100" width="70" height="80" fill="#3479ee"/>
<text x="95" y="150" text-anchor="middle" fill="#fff" font-size="24">N</text><text x="165" y="150" text-anchor="middle" fill="#fff" font-size="24">S</text>
<text x="130" y="210" text-anchor="middle" fill="#9aa3b5" font-size="14">자석 (고정)</text>
<g id="cone"><path d="M215 112 L215 168 L245 168 L245 112Z" fill="#e08a3a"/>
${[0,1,2,3].map(j=>`<line x1="${219+j*7}" y1="110" x2="${219+j*7}" y2="170" stroke="#7a4a1c" stroke-width="2"/>`).join('')}
<path d="M245 120 L400 40 L400 240 L245 160Z" fill="#cfd6e4" opacity=".9"/><text x="340" y="146" text-anchor="middle" fill="#1d2130" font-size="16">진동판</text>
<text x="230" y="100" text-anchor="middle" fill="#ff9a4a" font-size="14">코일</text></g>
<g id="waves">${[0,1,2].map(j=>`<path d="M${440+j*40} 80 Q${470+j*40} 140 ${440+j*40} 200" stroke="#ffd23a" stroke-width="4" fill="none" opacity="0" id="w${j}"/>`).join('')}</g></svg>
<div class="say" id="ssay"></div>
<div class="ctrl"><button class="btn2" id="a">전류 → 한 방향</button><button class="btn2" id="b">전류 ← 반대 방향</button><button class="btn" id="m">방향이 계속 바뀌는 전류 (소리!)</button><button class="btn2" id="s">멈춤</button></div>`;
const q=s=>el.querySelector(s);
const txt={stop:'버튼을 눌러 코일에 전류를 흘려 봐!',a:'전류가 한 방향 → 코일이 <b>앞으로 밀린 채</b> 그대로. 진동이 없어서 소리가 계속 나지 않아.',b:'전류 방향을 바꾸니 힘의 방향도 반대 → 코일이 <b>뒤로</b> 당겨졌어!',m:'전류 방향이 계속 바뀌니까 힘의 방향도 계속 바뀌어 → 코일·진동판이 <b style="color:var(--y)">앞뒤로 진동 → 소리!</b>'};
const set=m=>{mode=m;q('#ssay').innerHTML=say(txt[m]);
if(window._osc){try{window._osc.stop()}catch(e){}window._osc=null}
if(m==='m'){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=262;g.gain.value=.05;o.connect(g);g.connect(AC.destination);o.start();
[262,330,392,523,392,330].forEach((f,k)=>o.frequency.setValueAtTime(f,AC.currentTime+k*.35));o.stop(AC.currentTime+2.1);window._osc=o;setTimeout(()=>{if(mode==='m')set('m')},2150)}catch(e){}}};
q('#a').onclick=()=>set('a');q('#b').onclick=()=>set('b');q('#m').onclick=()=>set('m');q('#s').onclick=()=>set('stop');set('stop');
const tick=t=>{const dt=Math.min(.05,(t-(last||t))/1000);last=t;ph+=dt;
const target=mode==='a'?22:mode==='b'?-22:mode==='m'?Math.sin(ph*40)*16:0;off+=(target-off)*(mode==='m'?1:Math.min(1,dt*10));
q('#cone').setAttribute('transform',`translate(${off} 0)`);
[0,1,2].forEach(j=>q('#w'+j).setAttribute('opacity',mode==='m'?(.5+.5*Math.sin(ph*8-j)).toFixed(2):0));
anim=requestAnimationFrame(tick)};anim=requestAnimationFrame(tick)}
};

/* ---------- 화면: 배틀 ---------- */
function battle(i){
stopAll();const isB=i==='boss', s=isB?BOSS:STAGES[i];
const queue=shuffle(s.q).map(o=>{const order=shuffle(o.c.map((c,k)=>k));return {...o,c:order.map(k=>o.c[k]),a:order.indexOf(o.a)}});
const total=queue.length;let hp=total,hearts=isB?5:3,maxH=hearts,combo=0,maxCombo=0,score=0,wrong=[],n=0;const LIM=isB?12:15;
app.innerHTML=`<div class="top"><h2>${isB?'최종 보스전':'배틀 · '+s.t}</h2><button class="btn2" id="back">맵</button></div>
<div class="arena"><div class="fighter" id="me"><img class="ava big" src="${IMG}" alt="조고숭" style="width:min(30vw,140px);height:min(30vw,140px)"><div class="nm">조고숭</div><div class="hearts" id="hearts"></div></div>
<div class="vs">VS</div>
<div class="fighter" id="foe">${mon(s.mon[0],s.mon[1],isB)}<div class="nm">${s.mn}</div><div class="hp"><i id="hp"></i></div></div></div>
<div class="hud"><span>점수 <b id="sc">0</b></span><span class="combo" id="cb"></span><span id="left"></span></div>
<div class="timer"><i id="tm"></i></div><div id="q"></div>`;
$('#back').onclick=home;
const upd=()=>{$('#hearts').textContent='♥'.repeat(hearts)+'♡'.repeat(maxH-hearts);$('#hp').style.width=(hp/total*100)+'%';$('#sc').textContent=score;$('#cb').textContent=combo>1?combo+' COMBO!':'';$('#left').textContent=`남은 몬스터 체력 ${hp}`};
const anim2=(id,c)=>{const e=$(id);e.classList.remove(c);void e.offsetWidth;e.classList.add(c)};
function ask(){
clearInterval(tmr);upd();
if(hp<=0)return finish(true);if(hearts<=0)return finish(false);
const o=queue.shift();n++;let t=LIM,done=false;
$('#q').innerHTML=`<div class="qcard"><div class="qn">${o.re?'다시 나온 문제 · ':''}문제 ${n}</div><h2>${o.q}</h2><div class="ch">${o.c.map((c,k)=>`<button data-k="${k}">${'①②③④'[k]} ${c}</button>`).join('')}</div><div id="ex"></div></div>`;
const tm=$('#tm');tm.style.width='100%';const t0=Date.now();
tmr=setInterval(()=>{t=LIM-(Date.now()-t0)/1000;tm.style.width=Math.max(0,t/LIM*100)+'%';tm.style.background=t<4?'var(--n)':'var(--y)';if(t<=0&&!done)pick(-1)},100);
const btns=[...document.querySelectorAll('.ch button')];
btns.forEach(b=>b.onclick=()=>pick(+b.dataset.k));
function pick(k){if(done)return;done=true;clearInterval(tmr);btns.forEach(b=>b.disabled=true);
btns[o.a].classList.add('ok');
if(k===o.a){combo++;maxCombo=Math.max(maxCombo,combo);hp--;const gain=100+Math.round(Math.max(0,t)*10)+(combo>1?combo*20:0);score+=gain;sGood();anim2('#foe','hit');floatTxt(combo>1?`${combo} COMBO +${gain}`:`+${gain}`);upd();setTimeout(ask,850)}
else{if(k>=0)btns[k].classList.add('no');combo=0;hearts--;sBad();anim2('#me','shake');floatTxt(k<0?'시간 초과!':'아야!',true);
if(!wrong.includes(o))wrong.push(o);queue.push({...o,re:true});upd();
$('#ex').innerHTML=`<div class="exp"><b>정답 ${'①②③④'[o.a]}</b> · ${o.e}<br><small>이 문제는 뒤에서 다시 나와요!</small></div><button class="btn" style="margin-top:10px;width:100%" id="nx">${hearts>0?'다음 문제':'결과 보기'}</button>`;
$('#nx').onclick=ask;$('#nx').focus()}}}
function finish(win){clearInterval(tmr);const key=isB?'boss':i;const stars=win?Math.max(1,Math.round(hearts/maxH*3)):0;
if(win){SAVE.stars[key]=Math.max(SAVE.stars[key]||0,stars);SAVE.best[key]=Math.max(SAVE.best[key]||0,score);save(SAVE)}
if(win){[523,659,784,1047].forEach((f,k)=>setTimeout(()=>beep(f,.15,'square',.05),k*120))}
const nextI=!isB&&i<STAGES.length-1?i+1:null;
app.innerHTML=`<div class="result">${win?`<img class="ava big" src="${IMG}" alt="조고숭">`:mon(s.mon[0],s.mon[1],isB)}
<div class="big">${win?(isB?'조고숭 탈출 성공!':s.mn+' 격파!'):'조고숭이 쓰러졌어…'}</div>
${win?`<div class="stars">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div>`:''}
<p>점수 <b style="color:var(--y)">${score}</b> · 최대 콤보 ${maxCombo} · 틀린 문제 ${wrong.length}개${win&&SAVE.best[key]===score?' · <b style="color:var(--y)">최고 기록!</b>':''}</p>
<p class="tiny">${win?(isB?'자기장 행성의 모든 관문을 통과했어! 고마워 친구!':'틀린 문제도 결국 다 맞혔어. 이게 바로 반복 훈련!'):'하트가 다 떨어졌어. 아래 해설을 읽고 다시 도전!'}</p>
<div class="row" style="justify-content:center;margin:14px 0">${win&&nextI!==null?`<button class="btn" id="nx">다음 관문으로</button>`:''}<button class="${win&&nextI!==null?'btn2':'btn'}" id="rt">다시 도전</button><button class="btn2" id="mp">맵</button></div>
${wrong.length?`<h3 style="text-align:left;margin:20px 0 4px">오늘 틀린 문제 복습</h3>`+wrong.map(o=>`<div class="rv">${o.q}<br><b>정답: ${o.c[o.a]}</b><br><span class="tiny">${o.e.replace(/<[^>]+>/g,'')}</span></div>`).join(''):''}</div>`;
$('#rt').onclick=()=>battle(i);$('#mp').onclick=home;if(win&&nextI!==null)$('#nx').onclick=()=>talk(nextI,0);scrollTo(0,0)}
ask();scrollTo(0,0);
}
home();
let deferred=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;showInstall()});
function showInstall(){if(!deferred||document.getElementById('inst'))return;const b=document.createElement('button');b.id='inst';b.className='btn';b.textContent='홈 화면에 앱 설치';b.style.cssText='position:fixed;right:14px;bottom:14px;z-index:20';b.onclick=async()=>{deferred.prompt();await deferred.userChoice;deferred=null;b.remove()};document.body.appendChild(b)}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
